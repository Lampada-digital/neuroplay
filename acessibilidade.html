<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeuroPlay - Acessibilidade</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/><link rel="stylesheet" href="../css/responsive.css"/>
</head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/storage.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const c=NPAccessibility.load();
const content='<div class="np-card" style="max-width:720px"><h2 class="h4 mb-3"><i class="bi bi-universal-access text-np"></i> Acessibilidade</h2><p class="text-muted">Ajuste a plataforma ao seu conforto.</p><div class="mb-3"><label class="form-label" for="fs">Tamanho da fonte: <span id="fsV">'+c.fontSize+'px</span></label><input type="range" class="form-range" id="fs" min="14" max="24" step="1" value="'+c.fontSize+'"/></div><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="hc" '+(c.highContrast?'checked':'')+'/><label class="form-check-label" for="hc">Alto contraste</label></div><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="rm" '+(c.reduceMotion?'checked':'')+'/><label class="form-check-label" for="rm">Reduzir animações</label></div><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="sd" '+(c.sound?'checked':'')+'/><label class="form-check-label" for="sd">Sons</label></div><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="sp" '+(c.speech?'checked':'')+'/><label class="form-check-label" for="sp">Instruções faladas</label></div><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="lb" '+(c.largeButtons?'checked':'')+'/><label class="form-check-label" for="lb">Botões grandes</label></div><div class="d-flex gap-2 mt-3"><button class="btn btn-np" id="sv"><i class="bi bi-check-lg"></i> Salvar</button><button class="btn btn-ghost" id="rs">Restaurar</button></div></div>';
document.getElementById('app').innerHTML=NPApp.renderLayout('aluno','acessibilidade.html','Acessibilidade',content);NPApp.initSidebarToggle();
const fs=document.getElementById('fs');fs.addEventListener('input',()=>document.getElementById('fsV').textContent=fs.value+'px');
document.getElementById('sv').addEventListener('click',()=>{NPAccessibility.save({fontSize:+fs.value,highContrast:document.getElementById('hc').checked,reduceMotion:document.getElementById('rm').checked,sound:document.getElementById('sd').checked,speech:document.getElementById('sp').checked,largeButtons:document.getElementById('lb').checked});NPAccessibility.toast('Salvo!')});
document.getElementById('rs').addEventListener('click',()=>{NPAccessibility.save({fontSize:16,highContrast:false,reduceMotion:false,sound:true,speech:false,largeButtons:false});location.reload()})});
</script>
</body></html>
