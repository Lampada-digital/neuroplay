<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeuroPlay - Administrador</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/><link rel="stylesheet" href="../css/responsive.css"/>
</head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/storage.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const students=NPStorage.getStudents();const teachers=NPStorage.getTeachers();const classes=NPStorage.getClasses();
const content='<div class="row g-3 mb-4"><div class="col-6 col-md-3"><div class="np-stat"><div class="np-stat-icon" style="background:var(--np-purple)"><i class="bi bi-people"></i></div><div><div class="np-stat-value">'+students.length+'</div><div class="np-stat-label">Alunos</div></div></div></div><div class="col-6 col-md-3"><div class="np-stat"><div class="np-stat-icon" style="background:var(--np-blue)"><i class="bi bi-person-workspace"></i></div><div><div class="np-stat-value">'+teachers.length+'</div><div class="np-stat-label">Professores</div></div></div></div><div class="col-6 col-md-3"><div class="np-stat"><div class="np-stat-icon" style="background:var(--np-green)"><i class="bi bi-collection"></i></div><div><div class="np-stat-value">'+classes.length+'</div><div class="np-stat-label">Turmas</div></div></div></div><div class="col-6 col-md-3"><div class="np-stat"><div class="np-stat-icon" style="background:var(--np-orange)"><i class="bi bi-controller"></i></div><div><div class="np-stat-value">'+NPCatalog.GAMES.length+'</div><div class="np-stat-label">Jogos</div></div></div></div></div><div class="row g-3"><div class="col-lg-6"><div class="np-card"><h3 class="h6 fw-bold mb-3"><i class="bi bi-person-workspace text-np"></i> Professores</h3><form id="tf" class="d-flex gap-2 mb-3"><input class="form-control" name="name" placeholder="Nome" required/><input class="form-control" name="email" placeholder="E-mail" type="email" required/><button class="btn btn-np">Adicionar</button></form>'+(teachers.length===0?'<p class="text-muted">Nenhum professor.</p>':'<ul class="list-group">'+teachers.map(t=>'<li class="list-group-item d-flex justify-content-between"><span>'+t.name+' <small class="text-muted">('+t.email+')</small></span><button class="btn btn-sm btn-ghost" data-delt="'+t.id+'"><i class="bi bi-trash"></i></button></li>').join('')+'</ul>')+'</div></div><div class="col-lg-6"><div class="np-card"><h3 class="h6 fw-bold mb-3"><i class="bi bi-controller text-np"></i> Jogos</h3><div class="table-responsive"><table class="np-table"><thead><tr><th>Jogo</th><th>Categoria</th><th>Faixas</th></tr></thead><tbody>'+NPCatalog.GAMES.map(g=>'<tr><td>'+g.icon+' '+g.title+'</td><td><span class="badge-np">'+(NPCatalog.CATEGORIES.find(c=>c.id===g.category)?.label)+'</span></td><td>'+g.ages.join(', ')+'</td></tr>').join('')+'</tbody></table></div></div></div></div><div class="np-card mt-3"><h3 class="h6 fw-bold mb-3"><i class="bi bi-gear text-np"></i> Configurações</h3><div class="d-flex flex-wrap gap-2"><button class="btn btn-np-outline" id="btnExport"><i class="bi bi-download"></i> Exportar</button><button class="btn btn-np-outline" id="btnImport"><i class="bi bi-upload"></i> Importar</button><button class="btn btn-ghost text-danger" id="btnReset"><i class="bi bi-trash"></i> Limpar tudo</button></div><input type="file" id="fileImport" accept="application/json" hidden/></div>';
document.getElementById('app').innerHTML=NPApp.renderLayout('admin','administrador.html','Administração',content);NPApp.initSidebarToggle();
document.getElementById('tf').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);NPStorage.addTeacher({name:fd.get('name'),email:fd.get('email')});NPAccessibility.toast('Adicionado');render()});
document.querySelectorAll('[data-delt]').forEach(b=>b.addEventListener('click',()=>{NPStorage.setTeachers(NPStorage.getTeachers().filter(t=>t.id!==b.dataset.delt));render()}));
document.getElementById('btnExport').onclick=()=>{const d={};Object.values(NPStorage.KEYS).forEach(k=>d[k]=NPStorage.get(k));const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='neuroplay-backup.json';a.click()};
document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);Object.entries(d).forEach(([k,v])=>NPStorage.set(k,v));NPAccessibility.toast('Importado');render()}catch{NPAccessibility.toast('Inválido')}};r.readAsText(f)};
document.getElementById('btnReset').onclick=()=>{if(confirm('Apagar tudo?')){Object.values(NPStorage.KEYS).forEach(k=>NPStorage.remove(k));location.href='../index.html'}}});
</script>
</body></html>
