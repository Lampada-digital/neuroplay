<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeuroPlay - Atenção</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
<link rel="stylesheet" href="../css/responsive.css"/><link rel="stylesheet" href="../css/games.css"/>
</head><body><div class="container py-4"><a href="../pages/jogos.html" class="btn btn-ghost mb-3"><i class="bi bi-arrow-left"></i> Voltar</a><div id="gameRoot"></div></div>
<script src="../js/storage.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>const FIND_SETS=[{base:'🐶',diff:'🐱'},{base:'🍎',diff:'🍊'},{base:'⭐',diff:'🌟'},{base:'🔵',diff:'🔴'},{base:'🌼',diff:'🌻'},{base:'🐟',diff:'🐠'},{base:'🚗',diff:'🚙'},{base:'🎈',diff:'🎁'}];
const SHAPES=['🔴','🟠','🟡','🟢','🔵','🟣'];
const DIFFS={very_easy:{grid:9,targets:1},easy:{grid:12,targets:1},medium:{grid:16,targets:2},hard:{grid:20,targets:3},advanced:{grid:25,targets:4}};
let S={score:0,round:1,start:0,timer:null,diff:'medium',mode:'find',remaining:0};
function init(){const p=new URLSearchParams(location.search);S.mode=p.get('mode')==='shapes'?'shapes':'find';const profile=NPStorage.getProfile()||{};S.diff=profile.difficulty||'medium';
document.getElementById('gameRoot').innerHTML='<div class="np-game-wrap"><div class="np-game-header"><div><h1 class="h4 mb-1" id="tt">'+(S.mode==='shapes'?'🔷 Formas Geométricas':'🔍 Encontre o Objeto')+'</h1><p class="text-muted mb-0" id="ins">'+(S.mode==='shapes'?'Toque em todas as formas iguais.':'Encontre o item diferente.')+'</p></div><div class="np-game-stats"><div class="np-game-stat"><i class="bi bi-star-fill np-star"></i> <span id="sc">0</span></div><div class="np-game-stat"><i class="bi bi-clock"></i> <span id="tm">0s</span></div><div class="np-game-stat">Rodada <span id="rn">1</span></div></div></div><div class="d-flex gap-2 mb-3 flex-wrap"><select class="form-select form-select-sm" id="ds" style="max-width:180px"></select><button class="btn btn-np" id="rs"><i class="bi bi-arrow-clockwise"></i> Reiniciar</button></div><div id="th" class="text-center mb-2 fs-4"></div><div class="attention-grid" id="gr"></div></div>';
NPCatalog.DIFFICULTIES.forEach(d=>document.getElementById('ds').insertAdjacentHTML('beforeend','<option value="'+d.id+'" '+(d.id===S.diff?'selected':'')+'>'+d.label+'</option>'));
document.getElementById('ds').addEventListener('change',e=>{S.diff=e.target.value;startRound()});document.getElementById('rs').addEventListener('click',()=>{S.score=0;S.round=1;document.getElementById('sc').textContent=0;startRound()});startRound()}
function startRound(){clearInterval(S.timer);const c=DIFFS[S.diff];const gr=document.getElementById('gr');const cols=Math.ceil(Math.sqrt(c.grid));gr.style.gridTemplateColumns='repeat('+cols+',1fr)';
let items=[],tIdx=[];
if(S.mode==='shapes'){const b=SHAPES[Math.floor(Math.random()*SHAPES.length)];items=Array(c.grid).fill(b);for(let i=0;i<c.targets;i++){let idx;do{idx=Math.floor(Math.random()*c.grid)}while(items[idx]!==b);let d;do{d=SHAPES[Math.floor(Math.random()*SHAPES.length)]}while(d===b);items[idx]=d;tIdx.push(idx)}document.getElementById('th').innerHTML='Encontre todos os <strong>'+b+'</strong>'}
else{const s=FIND_SETS[Math.floor(Math.random()*FIND_SETS.length)];items=Array(c.grid).fill(s.base);for(let i=0;i<c.targets;i++){let idx;do{idx=Math.floor(Math.random()*c.grid)}while(items[idx]!==s.base);items[idx]=s.diff;tIdx.push(idx)}document.getElementById('th').innerHTML='Encontre o <strong>'+s.diff+'</strong>'}
S.remaining=tIdx.length;gr.innerHTML=items.map((e,i)=>'<button class="attention-item" data-i="'+i+'" data-t="'+(tIdx.includes(i)?'1':'0')+'">'+e+'</button>').join('');
gr.querySelectorAll('.attention-item').forEach(el=>el.addEventListener('click',()=>{if(el.classList.contains('correct')||el.classList.contains('wrong'))return;if(el.dataset.t==='1'){el.classList.add('correct');S.remaining--;S.score+=10;document.getElementById('sc').textContent=S.score;NPAccessibility.feedback('success');if(S.remaining===0)nextRound()}else{el.classList.add('wrong');NPAccessibility.feedback('error');setTimeout(()=>el.classList.remove('wrong'),500)}}));
document.getElementById('rn').textContent=S.round;S.start=Date.now();S.timer=setInterval(()=>{document.getElementById('tm').textContent=Math.floor((Date.now()-S.start)/1000)+'s'},500);NPAccessibility.speak(document.getElementById('th').textContent)}
function nextRound(){S.round++;setTimeout(()=>{if(S.round>5){clearInterval(S.timer);const p=NPStorage.getProfile();if(p){NPStorage.addProgress(p.id,{gameId:S.mode==='shapes'?'formas':'atencao_objeto',score:100,duration:Date.now()-S.start,difficulty:S.diff});p.stars=(p.stars||0)+2;NPStorage.setProfile(p)}NPAccessibility.feedback('star');alert('🎉 Parabéns!\\nPontos: '+S.score+'\\nEstrelas: 2 ⭐');S.round=1;S.score=0;document.getElementById('sc').textContent=0}startRound()},600)}
document.addEventListener('DOMContentLoaded',init);</script>
</body></html>
