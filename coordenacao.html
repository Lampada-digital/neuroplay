<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeuroPlay - Coordenação</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
<link rel="stylesheet" href="../css/responsive.css"/><link rel="stylesheet" href="../css/games.css"/>
</head><body><div class="container py-4"><a href="../pages/jogos.html" class="btn btn-ghost mb-3"><i class="bi bi-arrow-left"></i> Voltar</a><div id="gameRoot"></div></div>
<script src="../js/storage.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>let S={mode:'puzzle',moves:0,score:0};
function init(){const p=new URLSearchParams(location.search);S.mode=p.get('mode')==='maze'?'maze':'puzzle';
document.getElementById('gameRoot').innerHTML='<div class="np-game-wrap"><div class="np-game-header"><div><h1 class="h4 mb-1" id="tt">'+(S.mode==='maze'?'🌀 Labirinto':'🧩 Quebra-Cabeça')+'</h1><p class="text-muted mb-0" id="ins">'+(S.mode==='maze'?'Use setas ou botões para chegar ao 🏁':'Deslize as peças para ordenar.')+'</p></div><div class="np-game-stats"><div class="np-game-stat"><i class="bi bi-star-fill np-star"></i> <span id="sc">0</span></div><div class="np-game-stat">Movimentos <span id="mv">0</span></div></div></div><div id="ct"></div></div>';
if(S.mode==='maze')buildMaze();else buildPuzzle()}
function buildPuzzle(){const size=3;let tiles=[1,2,3,4,5,6,7,8,0];let ei=8;for(let i=0;i<80;i++){const n=getN(ei,size);const r=n[Math.floor(Math.random()*n.length)];[tiles[ei],tiles[r]]=[tiles[r],tiles[ei]];ei=r}S.tiles=tiles;S.size=size;S.ei=tiles.indexOf(0);renderPuzzle()}
function getN(i,s){const r=Math.floor(i/s),c=i%s,n=[];if(r>0)n.push(i-s);if(r<s-1)n.push(i+s);if(c>0)n.push(i-1);if(c<s-1)n.push(i+1);return n}
function renderPuzzle(){const ct=document.getElementById('ct');ct.innerHTML='<div class="puzzle-grid" style="grid-template-columns:repeat('+S.size+',1fr)">'+S.tiles.map((t,i)=>'<div class="puzzle-tile '+(t===0?'empty':'')+'" data-i="'+i+'">'+(t||'')+'</div>').join('')+'</div><div class="text-center mt-3"><button class="btn btn-np" id="rp"><i class="bi bi-arrow-clockwise"></i> Embaralhar</button></div>';ct.querySelectorAll('.puzzle-tile').forEach(el=>el.addEventListener('click',()=>tryMove(+el.dataset.i)));document.getElementById('rp').addEventListener('click',()=>{S.moves=0;document.getElementById('mv').textContent=0;buildPuzzle()})}
function tryMove(i){const n=getN(i,S.size);if(!n.includes(S.ei))return;[S.tiles[i],S.tiles[S.ei]]=[S.tiles[S.ei],S.tiles[i]];S.ei=i;S.moves++;document.getElementById('mv').textContent=S.moves;NPAccessibility.clickSound();renderPuzzle();if(isSolved())winPuzzle()}
function isSolved(){for(let i=0;i<S.tiles.length-1;i++)if(S.tiles[i]!==i+1)return false;return S.tiles[S.tiles.length-1]===0}
function winPuzzle(){const p=NPStorage.getProfile();if(p){NPStorage.addProgress(p.id,{gameId:'puzzle',score:100,duration:0,difficulty:'medium'});p.stars=(p.stars||0)+3;NPStorage.setProfile(p)}NPAccessibility.feedback('star');alert('🎉 Resolvido!\\nMovimentos: '+S.moves+'\\nEstrelas: 3 ⭐');S.moves=0;buildPuzzle()}
function buildMaze(){const W=9,H=9;const grid=Array.from({length:H},()=>Array(W).fill(1));function carve(x,y){grid[y][x]=0;const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-.5);for(const[dx,dy]of dirs){const nx=x+dx,ny=y+dy;if(nx>0&&nx<W-1&&ny>0&&ny<H-1&&grid[ny][nx]===1){grid[y+dy/2][x+dx/2]=0;carve(nx,ny)}}}carve(1,1);grid[1][1]=0;grid[H-2][W-2]=0;S.maze=grid;S.player={x:1,y:1};S.goal={x:W-2,y:H-2};renderMaze();document.addEventListener('keydown',onKey)}
function onKey(e){if(S.mode!=='maze')return;let{x,y}=S.player;if(e.key==='ArrowUp')y--;else if(e.key==='ArrowDown')y++;else if(e.key==='ArrowLeft')x--;else if(e.key==='ArrowRight')x++;else return;if(S.maze[y]&&S.maze[y][x]===0){S.player={x,y};S.moves++;document.getElementById('mv').textContent=S.moves;NPAccessibility.clickSound();renderMaze();if(x===S.goal.x&&y===S.goal.y)winMaze()}}
function renderMaze(){const ct=document.getElementById('ct');const{maze,player,goal}=S;ct.innerHTML='<div class="maze-grid" style="grid-template-columns:repeat('+maze[0].length+',1fr)">'+maze.flatMap((row,y)=>row.map((v,x)=>{let c='maze-cell',co='';if(v===1)c+=' wall';if(x===player.x&&y===player.y){c+=' player';co='🧒'}else if(x===goal.x&&y===goal.y){c+=' goal';co='🏁'}return '<div class="'+c+'">'+co+'</div>'})).join('')+'</div><div class="text-center mt-3 d-flex gap-2 justify-content-center flex-wrap"><button class="btn btn-ghost" data-d="up"><i class="bi bi-arrow-up"></i></button><button class="btn btn-ghost" data-d="left"><i class="bi bi-arrow-left"></i></button><button class="btn btn-ghost" data-d="down"><i class="bi bi-arrow-down"></i></button><button class="btn btn-ghost" data-d="right"><i class="bi bi-arrow-right"></i></button></div>';ct.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{const k={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.d];onKey({key:k})}))}
function winMaze(){document.removeEventListener('keydown',onKey);const p=NPStorage.getProfile();if(p){NPStorage.addProgress(p.id,{gameId:'labirinto',score:100,duration:0,difficulty:'medium'});p.stars=(p.stars||0)+3;NPStorage.setProfile(p)}NPAccessibility.feedback('star');alert('🎉 Labirinto concluído!\\nMovimentos: '+S.moves+'\\nEstrelas: 3 ⭐');S.moves=0;buildMaze()}
document.addEventListener('DOMContentLoaded',init);</script>
</body></html>
