<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeuroPlay - Emoções</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
<link rel="stylesheet" href="../css/responsive.css"/><link rel="stylesheet" href="../css/games.css"/>
</head><body><div class="container py-4"><a href="../pages/jogos.html" class="btn btn-ghost mb-3"><i class="bi bi-arrow-left"></i> Voltar</a><div id="gameRoot"></div></div>
<script src="../js/storage.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>const EMOTIONS=[{face:'😊',name:'FELIZ',desc:'Sorrindo'},{face:'😢',name:'TRISTE',desc:'Com lágrimas'},{face:'😠',name:'BRAVO',desc:'Sobrancelhas franzidas'},{face:'😲',name:'SURPREENDIDO',desc:'Boca aberta'},{face:'😨',name:'ASSUSTADO',desc:'Olhos arregalados'},{face:'🤔',name:'PENSATIVO',desc:'Mão no queixo'}];
let S={q:0,score:0,total:8,correct:0};
function init(){document.getElementById('gameRoot').innerHTML='<div class="np-game-wrap"><div class="np-game-header"><div><h1 class="h4 mb-1">😊 Reconhecimento de Emoções</h1><p class="text-muted mb-0">Qual emoção esta expressão mostra?</p></div><div class="np-game-stats"><div class="np-game-stat"><i class="bi bi-star-fill np-star"></i> <span id="sc">0</span></div><div class="np-game-stat">Questão <span id="qn">1</span>/8</div></div></div><div id="ct"></div></div>';reset()}
function reset(){S.q=0;S.score=0;S.correct=0;document.getElementById('sc').textContent=0;next()}
function next(){S.q++;if(S.q>S.total)return finish();document.getElementById('qn').textContent=S.q;const e=EMOTIONS[Math.floor(Math.random()*EMOTIONS.length)];const opts=shuffle([e.name,...shuffle(EMOTIONS.filter(x=>x.name!==e.name).map(x=>x.name)).slice(0,3)]);document.getElementById('ct').innerHTML='<div class="emotion-card">'+e.face+'</div><p class="text-center fs-5"><em>'+e.desc+'</em></p><div class="emotion-options">'+opts.map(o=>'<button class="math-option" data-v="'+o+'">'+o+'</button>').join('')+'</div>';document.querySelectorAll('.math-option').forEach(b=>b.addEventListener('click',()=>check(b.dataset.v===e.name,b)));NPAccessibility.speak('Qual emoção esta expressão mostra? Dica: '+e.desc)}
function check(ok,btn){document.querySelectorAll('.math-option').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');if(ok){S.score+=10;S.correct++;document.getElementById('sc').textContent=S.score;NPAccessibility.feedback('success')}else NPAccessibility.feedback('error');setTimeout(next,900)}
function finish(){const pct=Math.round(S.correct/S.total*100);const stars=pct>=90?3:pct>=60?2:1;const p=NPStorage.getProfile();if(p){NPStorage.addProgress(p.id,{gameId:'emocoes',score:pct,duration:0,difficulty:'medium'});p.stars=(p.stars||0)+stars;NPStorage.setProfile(p)}NPAccessibility.feedback('star');alert('🎉 Fim!\\nAcertos: '+S.correct+'/'+S.total+'\\nDesempenho: '+pct+'%\\nEstrelas: '+stars+' ⭐');reset()}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
document.addEventListener('DOMContentLoaded',init);</script>
</body></html>
