<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Atenção</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/games.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
</head><body>
<div class="game-container">
  <a href="../pages/aluno/games.html" class="btn btn-ghost mb-3">← Voltar</a>
  <div class="game-header">
    <div><h1 class="game-title" id="title">🔍 Encontre o Diferente</h1><p class="text-muted mb-0" id="instr">Encontre o item diferente</p></div>
    <div class="game-stats"><div class="game-stat">⭐ <span id="score">0</span></div><div class="game-stat">Rodada <span id="round">1</span></div></div>
  </div>
  <div class="game-board">
    <div class="game-controls mb-3"><select class="form-control" id="diff" style="max-width:200px"><option value="9">Fácil (3x3)</option><option value="16" selected>Médio (4x4)</option><option value="25">Difícil (5x5)</option></select><button class="btn btn-primary" id="restart">Reiniciar</button></div>
    <div id="hint" class="text-center fs-4 mb-3"></div>
    <div class="attention-grid" id="grid"></div>
  </div>
</div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>
var SETS=[{b:'🐶',d:'🐱'},{b:'🍎',d:'🍊'},{b:'⭐',d:'🌟'},{b:'🔵',d:'🔴'},{b:'🌼',d:'🌻'},{b:'🐟',d:'🐠'}];
var SHAPES=['🔴','🟠','🟡','🟢','🔵','🟣'];
var mode=new URLSearchParams(location.search).get('mode')||'find';
var S={score:0,round:1,remaining:0};
if(mode==='shapes'){document.getElementById('title').textContent='🔷 Formas';document.getElementById('instr').textContent='Encontre as formas iguais'}
function start(){
  var n=+document.getElementById('diff').value;
  var cols=Math.ceil(Math.sqrt(n));
  var grid=document.getElementById('grid');
  grid.style.gridTemplateColumns='repeat('+cols+',1fr)';
  var items=[],tIdx=[];
  if(mode==='shapes'){
    var base=SHAPES[Math.floor(Math.random()*SHAPES.length)];
    items=Array(n).fill(base);
    var targets=Math.min(3,Math.floor(n/5));
    for(var i=0;i<targets;i++){var idx;do{idx=Math.floor(Math.random()*n)}while(items[idx]!==base);var d;do{d=SHAPES[Math.floor(Math.random()*SHAPES.length)]}while(d===base);items[idx]=d;tIdx.push(idx)}
    document.getElementById('hint').innerHTML='Encontre todos os <strong>'+base+'</strong>';
  }else{
    var s=SETS[Math.floor(Math.random()*SETS.length)];
    items=Array(n).fill(s.b);
    var targets=Math.min(3,Math.floor(n/5));
    for(var i=0;i<targets;i++){var idx;do{idx=Math.floor(Math.random()*n)}while(items[idx]!==s.b);items[idx]=s.d;tIdx.push(idx)}
    document.getElementById('hint').innerHTML='Encontre o <strong>'+s.d+'</strong>';
  }
  S.remaining=tIdx.length;
  var html='';
  items.forEach(function(e,i){html+='<button class="attention-item" data-i="'+i+'" data-t="'+(tIdx.indexOf(i)>=0?'1':'0')+'">'+e+'</button>'});
  grid.innerHTML=html;
  grid.querySelectorAll('.attention-item').forEach(function(el){el.addEventListener('click',function(){
    if(el.classList.contains('correct')||el.classList.contains('wrong'))return;
    if(el.dataset.t==='1'){el.classList.add('correct');S.remaining--;S.score+=10;document.getElementById('score').textContent=S.score;NPAccess.feedback('success');if(S.remaining===0)nextRound()}
    else{el.classList.add('wrong');NPAccess.feedback('error');setTimeout(function(){el.classList.remove('wrong')},500)}
  })});
  document.getElementById('round').textContent=S.round;
}
function nextRound(){
  S.round++;
  if(S.round>5){
    var u=NPAuth.getCurrent();
    if(u){NPStorage.addProgress(u.id,{gameId:'atencao',score:100,duration:0});var st=NPStorage.getStudent(u.id);if(st){st.stars=(st.stars||0)+2;st.xp=(st.xp||0)+40;NPStorage.updateStudent(u.id,st)}}
    NPAccess.feedback('star');
    alert('🎉 Parabéns!\nPontos: '+S.score+'\nEstrelas: 2 ⭐');
    S.round=1;S.score=0;document.getElementById('score').textContent=0;
  }
  setTimeout(start,500);
}
document.getElementById('diff').addEventListener('change',function(){S.round=1;S.score=0;document.getElementById('score').textContent=0;start()});
document.getElementById('restart').addEventListener('click',function(){S.round=1;S.score=0;document.getElementById('score').textContent=0;start()});
start();
</script></body></html>
