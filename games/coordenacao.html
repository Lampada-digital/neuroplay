<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Coordenação</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/games.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
</head><body>
<div class="game-container">
  <a href="../pages/aluno/games.html" class="btn btn-ghost mb-3">← Voltar</a>
  <div class="game-header">
    <div><h1 class="game-title" id="title">🧩 Coordenação</h1><p class="text-muted mb-0" id="instr">Atividades</p></div>
    <div class="game-stats"><div class="game-stat">Movimentos <span id="moves">0</span></div></div>
  </div>
  <div class="game-board"><div id="content"></div></div>
</div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>
var mode=new URLSearchParams(location.search).get('mode')||'puzzle';
var S={moves:0};
if(mode==='maze'){document.getElementById('title').textContent='🌀 Labirinto';document.getElementById('instr').textContent='Use setas ou botões'}
else{document.getElementById('title').textContent='🧩 Quebra-Cabeça';document.getElementById('instr').textContent='Ordene os números'}
function getN(i,s){var r=Math.floor(i/s),c=i%s,n=[];if(r>0)n.push(i-s);if(r<s-1)n.push(i+s);if(c>0)n.push(i-1);if(c<s-1)n.push(i+1);return n}
function buildPuzzle(){
  var size=3;var tiles=[1,2,3,4,5,6,7,8,0];var ei=8;
  for(var i=0;i<80;i++){var n=getN(ei,size);var r=n[Math.floor(Math.random()*n.length)];var tmp=tiles[ei];tiles[ei]=tiles[r];tiles[r]=tmp;ei=r}
  S.tiles=tiles;S.size=size;S.ei=tiles.indexOf(0);
  renderPuzzle();
}
function renderPuzzle(){
  var c=document.getElementById('content');
  var html='<div class="puzzle-grid" style="grid-template-columns:repeat('+S.size+',1fr)">';
  S.tiles.forEach(function(t,i){html+='<div class="puzzle-tile '+(t===0?'empty':'')+'" data-i="'+i+'">'+(t||'')+'</div>'});
  html+='</div><div class="text-center mt-3"><button class="btn btn-primary" id="rp">Embaralhar</button></div>';
  c.innerHTML=html;
  c.querySelectorAll('.puzzle-tile').forEach(function(el){el.addEventListener('click',function(){tryMove(+el.dataset.i)})});
  document.getElementById('rp').addEventListener('click',function(){S.moves=0;document.getElementById('moves').textContent=0;buildPuzzle()});
}
function tryMove(i){
  var n=getN(i,S.size);
  if(n.indexOf(S.ei)<0)return;
  var tmp=S.tiles[i];S.tiles[i]=S.tiles[S.ei];S.tiles[S.ei]=tmp;
  S.ei=i;S.moves++;
  document.getElementById('moves').textContent=S.moves;
  NPAccess.playSound('click');
  renderPuzzle();
  if(isSolved())winPuzzle();
}
function isSolved(){for(var i=0;i<S.tiles.length-1;i++)if(S.tiles[i]!==i+1)return false;return S.tiles[S.tiles.length-1]===0}
function winPuzzle(){
  var u=NPAuth.getCurrent();
  if(u){NPStorage.addProgress(u.id,{gameId:'puzzle',score:100,duration:0});var st=NPStorage.getStudent(u.id);if(st){st.stars=(st.stars||0)+3;st.xp=(st.xp||0)+60;NPStorage.updateStudent(u.id,st)}}
  NPAccess.feedback('star');
  alert('🎉 Resolvido!\nMovimentos: '+S.moves+'\nEstrelas: 3 ⭐');
  S.moves=0;buildPuzzle();
}
function buildMaze(){
  var W=9,H=9;
  var grid=[];for(var y=0;y<H;y++){grid.push([]);for(var x=0;x<W;x++)grid[y].push(1)}
  function carve(x,y){
    grid[y][x]=0;
    var dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(function(){return Math.random()-.5});
    for(var d=0;d<dirs.length;d++){
      var dx=dirs[d][0],dy=dirs[d][1];
      var nx=x+dx,ny=y+dy;
      if(nx>0&&nx<W-1&&ny>0&&ny<H-1&&grid[ny][nx]===1){grid[y+dy/2][x+dx/2]=0;carve(nx,ny)}
    }
  }
  carve(1,1);grid[H-2][W-2]=0;
  S.maze=grid;S.player={x:1,y:1};S.goal={x:W-2,y:H-2};
  renderMaze();
  document.addEventListener('keydown',onKey);
}
function onKey(e){
  if(mode!=='maze')return;
  var x=S.player.x,y=S.player.y;
  if(e.key==='ArrowUp')y--;
  else if(e.key==='ArrowDown')y++;
  else if(e.key==='ArrowLeft')x--;
  else if(e.key==='ArrowRight')x++;
  else return;
  if(S.maze[y]&&S.maze[y][x]===0){S.player={x:x,y:y};S.moves++;document.getElementById('moves').textContent=S.moves;NPAccess.playSound('click');renderMaze();if(x===S.goal.x&&y===S.goal.y)winMaze()}
}
function renderMaze(){
  var c=document.getElementById('content');
  var maze=S.maze,player=S.player,goal=S.goal;
  var html='<div class="maze-grid" style="grid-template-columns:repeat('+maze[0].length+',1fr)">';
  for(var y=0;y<maze.length;y++){
    for(var x=0;x<maze[y].length;x++){
      var cl='maze-cell',co='';
      if(maze[y][x]===1)cl+=' wall';
      if(x===player.x&&y===player.y){cl+=' player';co='🧒'}
      else if(x===goal.x&&y===goal.y){cl+=' goal';co='🏁'}
      html+='<div class="'+cl+'">'+co+'</div>';
    }
  }
  html+='</div><div class="text-center mt-3 d-flex gap-2 justify-content-center flex-wrap"><button class="btn btn-ghost" data-d="up">↑</button><button class="btn btn-ghost" data-d="left">←</button><button class="btn btn-ghost" data-d="down">↓</button><button class="btn btn-ghost" data-d="right">→</button></div>';
  c.innerHTML=html;
  c.querySelectorAll('[data-d]').forEach(function(b){b.addEventListener('click',function(){var kmap={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};onKey({key:kmap[b.dataset.d]})})});
}
function winMaze(){
  document.removeEventListener('keydown',onKey);
  var u=NPAuth.getCurrent();
  if(u){NPStorage.addProgress(u.id,{gameId:'labirinto',score:100,duration:0});var st=NPStorage.getStudent(u.id);if(st){st.stars=(st.stars||0)+3;st.xp=(st.xp||0)+60;NPStorage.updateStudent(u.id,st)}}
  NPAccess.feedback('star');
  alert('🎉 Labirinto concluído!\nMovimentos: '+S.moves+'\nEstrelas: 3 ⭐');
  S.moves=0;buildMaze();
}
if(mode==='maze')buildMaze();else buildPuzzle();
</script></body></html>
