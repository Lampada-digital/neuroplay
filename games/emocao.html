<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Emoções</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/games.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
</head><body>
<div class="game-container">
  <a href="../pages/aluno/games.html" class="btn btn-ghost mb-3">← Voltar</a>
  <div class="game-header">
    <div><h1 class="game-title">😊 Emoções</h1><p class="text-muted mb-0">Qual emoção?</p></div>
    <div class="game-stats"><div class="game-stat">⭐ <span id="score">0</span></div><div class="game-stat">Q <span id="q">1</span>/8</div></div>
  </div>
  <div class="game-board"><div id="content"></div></div>
</div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>
var EM=[{face:'😊',name:'FELIZ',desc:'Sorrindo'},{face:'😢',name:'TRISTE',desc:'Com lágrimas'},{face:'😠',name:'BRAVO',desc:'Sobrancelhas franzidas'},{face:'😲',name:'SURPREENDIDO',desc:'Boca aberta'},{face:'😨',name:'ASSUSTADO',desc:'Olhos arregalados'},{face:'🤔',name:'PENSATIVO',desc:'Mão no queixo'}];
var S={q:0,score:0,correct:0,total:8};
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}
function next(){
  S.q++;
  if(S.q>S.total)return finish();
  document.getElementById('q').textContent=S.q;
  var e=EM[Math.floor(Math.random()*EM.length)];
  var others=EM.filter(function(x){return x.name!==e.name}).map(function(x){return x.name});
  var opts=shuffle([e.name].concat(shuffle(others).slice(0,3)));
  var html='<div class="emotion-card">'+e.face+'</div><p class="text-center fs-4"><em>'+e.desc+'</em></p><div class="emotion-options">';
  opts.forEach(function(o){html+='<button class="math-option" data-v="'+o+'">'+o+'</button>'});
  html+='</div>';
  document.getElementById('content').innerHTML=html;
  document.querySelectorAll('.math-option').forEach(function(b){b.addEventListener('click',function(){check(b.dataset.v===e.name,b)})});
}
function check(ok,btn){
  document.querySelectorAll('.math-option').forEach(function(b){b.disabled=true});
  btn.classList.add(ok?'correct':'wrong');
  if(ok){S.score+=10;S.correct++;document.getElementById('score').textContent=S.score;NPAccess.feedback('success')}
  else NPAccess.feedback('error');
  setTimeout(next,900);
}
function finish(){
  var pct=Math.round(S.correct/S.total*100);
  var stars=pct>=90?3:pct>=60?2:1;
  var u=NPAuth.getCurrent();
  if(u){NPStorage.addProgress(u.id,{gameId:'emocoes',score:pct,duration:0});var st=NPStorage.getStudent(u.id);if(st){st.stars=(st.stars||0)+stars;st.xp=(st.xp||0)+stars*20;NPStorage.updateStudent(u.id,st)}}
  NPAccess.feedback('star');
  alert('🎉 Fim!\nAcertos: '+S.correct+'/'+S.total+'\nDesempenho: '+pct+'%\nEstrelas: '+stars+' ⭐');
  S.q=0;S.score=0;S.correct=0;document.getElementById('score').textContent=0;next();
}
next();
</script></body></html>
