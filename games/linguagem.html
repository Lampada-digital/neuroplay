<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Linguagem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/games.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
</head><body>
<div class="game-container">
  <a href="../pages/aluno/games.html" class="btn btn-ghost mb-3">← Voltar</a>
  <div class="game-header">
    <div><h1 class="game-title" id="title">🔤 Linguagem</h1><p class="text-muted mb-0" id="instr">Atividades</p></div>
    <div class="game-stats"><div class="game-stat">⭐ <span id="score">0</span></div><div class="game-stat">Item <span id="q">1</span>/8</div></div>
  </div>
  <div class="game-board"><div id="content"></div></div>
</div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>
var MATCH=[{img:'🐶',word:'CACHORRO'},{img:'🐱',word:'GATO'},{img:'🍎',word:'MAÇÃ'},{img:'🍌',word:'BANANA'},{img:'🌞',word:'SOL'},{img:'🌙',word:'LUA'},{img:'🏠',word:'CASA'},{img:'🚗',word:'CARRO'}];
var SPELL=[{word:'BOLA',hint:'Objeto redondo'},{word:'CASA',hint:'Onde moramos'},{word:'GATO',hint:'Miau'},{word:'SOL',hint:'Brilha de dia'},{word:'LUA',hint:'Brilha à noite'},{word:'PAI',hint:'Pai de família'}];
var mode=new URLSearchParams(location.search).get('mode')||'match';
var S={q:0,score:0,correct:0,total:8,current:null};
if(mode==='spell'){document.getElementById('title').textContent='🔤 Formar Palavras';document.getElementById('instr').textContent='Monte a palavra'}
else{document.getElementById('title').textContent='🖼️ Imagem e Palavra';document.getElementById('instr').textContent='Escolha a palavra'}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}
function next(){
  S.q++;
  if(S.q>S.total)return finish();
  document.getElementById('q').textContent=S.q;
  var c=document.getElementById('content');
  if(mode==='match'){
    var it=MATCH[Math.floor(Math.random()*MATCH.length)];
    S.current=it;
    var others=MATCH.filter(function(x){return x.word!==it.word}).map(function(x){return x.word});
    var opts=shuffle([it.word].concat(shuffle(others).slice(0,3)));
    var html='<div class="emotion-card">'+it.img+'</div><p class="text-center fs-4">Qual é a palavra?</p><div class="emotion-options">';
    opts.forEach(function(o){html+='<button class="math-option" data-v="'+o+'">'+o+'</button>'});
    html+='</div>';
    c.innerHTML=html;
    c.querySelectorAll('.math-option').forEach(function(b){b.addEventListener('click',function(){check(b.dataset.v===it.word,b)})});
  }else{
    var it=SPELL[Math.floor(Math.random()*SPELL.length)];
    S.current=it;
    var letters=it.word.split('').concat(Array.from({length:3},function(){return 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)]}));
    letters=shuffle(letters);
    var slotsHtml='';
    for(var i=0;i<it.word.length;i++)slotsHtml+='<div class="word-letter"></div>';
    var lettersHtml='';
    letters.forEach(function(l,i){lettersHtml+='<button class="word-letter-btn" data-i="'+i+'" data-l="'+l+'">'+l+'</button>'});
    c.innerHTML='<p class="text-center fs-4"><em>'+it.hint+'</em></p><div class="word-slots" id="sl">'+slotsHtml+'</div><div class="word-letters" id="lt">'+lettersHtml+'</div><div class="text-center mt-3"><button class="btn btn-ghost" id="cw">Apagar</button></div>';
    bindSpell();
  }
}
function bindSpell(){
  var sl=document.getElementById('sl').children;
  var lt=document.querySelectorAll('#lt .word-letter-btn');
  var placed=Array(S.current.word.length).fill(null);
  lt.forEach(function(b){b.addEventListener('click',function(){
    var idx=-1;
    for(var i=0;i<placed.length;i++){if(placed[i]===null){idx=i;break}}
    if(idx<0)return;
    placed[idx]={l:b.dataset.l,i:+b.dataset.i};
    sl[idx].textContent=b.dataset.l;
    sl[idx].classList.add('filled');
    b.classList.add('used');b.disabled=true;
    NPAccess.playSound('click');
    var allFilled=true;
    for(var i=0;i<placed.length;i++){if(placed[i]===null){allFilled=false;break}}
    if(allFilled){
      var f='';
      for(var i=0;i<placed.length;i++)f+=placed[i].l;
      setTimeout(function(){check(f===S.current.word,null,f)},300);
    }
  })});
  document.getElementById('cw').addEventListener('click',function(){
    placed=Array(S.current.word.length).fill(null);
    Array.from(sl).forEach(function(s){s.textContent='';s.classList.remove('filled')});
    lt.forEach(function(b){b.classList.remove('used');b.disabled=false});
  });
}
function check(ok,btn,formed){
  if(btn){document.querySelectorAll('.math-option').forEach(function(b){b.disabled=true});btn.classList.add(ok?'correct':'wrong')}
  if(ok){S.score+=10;S.correct++;document.getElementById('score').textContent=S.score;NPAccess.feedback('success')}
  else{NPAccess.feedback('error');if(mode==='spell')NPAccess.toast('A palavra era: '+S.current.word)}
  setTimeout(next,1000);
}
function finish(){
  var pct=Math.round(S.correct/S.total*100);
  var stars=pct>=90?3:pct>=60?2:1;
  var u=NPAuth.getCurrent();
  if(u){NPStorage.addProgress(u.id,{gameId:'linguagem_'+mode,score:pct,duration:0});var st=NPStorage.getStudent(u.id);if(st){st.stars=(st.stars||0)+stars;st.xp=(st.xp||0)+stars*20;NPStorage.updateStudent(u.id,st)}}
  NPAccess.feedback('star');
  alert('🎉 Fim!\nAcertos: '+S.correct+'/'+S.total+'\nDesempenho: '+pct+'%\nEstrelas: '+stars+' ⭐');
  S.q=0;S.score=0;S.correct=0;document.getElementById('score').textContent=0;next();
}
next();
</script></body></html>
