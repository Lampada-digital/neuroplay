<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Lógica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/games.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
</head><body>
<div class="game-container">
  <a href="../pages/aluno/games.html" class="btn btn-ghost mb-3">← Voltar</a>
  <div class="game-header">
    <div><h1 class="game-title" id="title">🧵 Lógica</h1><p class="text-muted mb-0" id="instr">Atividades</p></div>
    <div class="game-stats"><div class="game-stat">⭐ <span id="score">0</span></div><div class="game-stat">Q <span id="q">1</span>/8</div></div>
  </div>
  <div class="game-board"><div id="content"></div></div>
</div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>
var CLASSIFY=[{title:'Frutas',items:['🍎','🍌','🍇','🍓','🍊'],odd:'🥕'},{title:'Animais',items:['🐶','🐱','🐭','🐰','🦊'],odd:'🌳'},{title:'Veículos',items:['🚗','🚙','🚌','🚓','🚕'],odd:'🏠'}];
var SEQ=[{seq:['🔴','🔵','🔴','🔵','🔴'],ans:'🔵',opts:['🔵','🔴','🟢','🟡']},{seq:['🌞','🌙','🌞','🌙','🌞'],ans:'🌙',opts:['🌙','🌞','⭐','☁️']},{seq:['1','2','3','4','5'],ans:'6',opts:['6','7','5','10']},{seq:['2','4','6','8'],ans:'10',opts:['10','9','12','11']}];
var mode=new URLSearchParams(location.search).get('mode')||'classify';
var S={q:0,score:0,correct:0,total:8};
if(mode==='sequence'){document.getElementById('title').textContent='🧵 Sequência Lógica';document.getElementById('instr').textContent='Complete a sequência'}
else{document.getElementById('title').textContent='🗂️ Classificação';document.getElementById('instr').textContent='Qual NÃO pertence?'}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}
function next(){
  S.q++;
  if(S.q>S.total)return finish();
  document.getElementById('q').textContent=S.q;
  var c=document.getElementById('content');
  if(mode==='classify'){
    var d=CLASSIFY[Math.floor(Math.random()*CLASSIFY.length)];
    var opts=shuffle([d.odd].concat(d.items.slice(0,3)));
    var html='<p class="text-center fs-4">Grupo: <strong>'+d.title+'</strong></p><div class="text-center fs-1 my-3">'+d.items.join(' ')+'</div><p class="text-center">Qual NÃO pertence?</p><div class="math-options">';
    opts.forEach(function(o){html+='<button class="math-option" data-v="'+o+'">'+o+'</button>'});
    html+='</div>';
    c.innerHTML=html;
    c.querySelectorAll('.math-option').forEach(function(b){b.addEventListener('click',function(){check(b.dataset.v===d.odd,b)})});
  }else{
    var d=SEQ[Math.floor(Math.random()*SEQ.length)];
    var html='<div class="text-center fs-1 my-3">'+d.seq.join(' ')+' <strong style="color:var(--np-primary)">?</strong></div><p class="text-center">Complete:</p><div class="math-options">';
    shuffle(d.opts).forEach(function(o){html+='<button class="math-option" data-v="'+o+'">'+o+'</button>'});
    html+='</div>';
    c.innerHTML=html;
    c.querySelectorAll('.math-option').forEach(function(b){b.addEventListener('click',function(){check(b.dataset.v===d.ans,b)})});
  }
}
function check(ok,btn){
  document.querySelectorAll('.math-option').forEach(function(b){b.disabled=true});
  btn.classList.add(ok?'correct':'wrong');
  if(ok){S.score+=10;S.correct++;document.getElementById('score').textContent=S.score;NPAccess.feedback('success')}
  else NPAccess.feedback('error');
  setTimeout(next,900);
}
function finish(){
  var pct=Math.round(S.correct/S.total*100);
  var stars=pct>=90?3:pct>=60?2:1;
  var u=NPAuth.getCurrent();
  if(u){NPStorage.addProgress(u.id,{gameId:'logica_'+mode,score:pct,duration:0});var st=NPStorage.getStudent(u.id);if(st){st.stars=(st.stars||0)+stars;st.xp=(st.xp||0)+stars*20;NPStorage.updateStudent(u.id,st)}}
  NPAccess.feedback('star');
  alert('🎉 Fim!\nAcertos: '+S.correct+'/'+S.total+'\nDesempenho: '+pct+'%\nEstrelas: '+stars+' ⭐');
  S.q=0;S.score=0;S.correct=0;document.getElementById('score').textContent=0;next();
}
next();
</script></body></html>
