<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Matemática</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/games.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
</head><body>
<div class="game-container">
  <a href="../pages/aluno/games.html" class="btn btn-ghost mb-3">← Voltar</a>
  <div class="game-header">
    <div><h1 class="game-title" id="title">➕ Matemática</h1><p class="text-muted mb-0" id="instr">Resolva as operações</p></div>
    <div class="game-stats"><div class="game-stat">⭐ <span id="score">0</span></div><div class="game-stat">Q <span id="q">1</span>/10</div></div>
  </div>
  <div class="game-board"><div id="content"></div></div>
</div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>
var mode=new URLSearchParams(location.search).get('mode')||'ops';
var S={q:0,score:0,correct:0,total:10};
if(mode==='count'){document.getElementById('title').textContent='🧮 Quantidade';document.getElementById('instr').textContent='Conte e escolha'}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}
function next(){
  S.q++;
  if(S.q>S.total)return finish();
  document.getElementById('q').textContent=S.q;
  var c=document.getElementById('content');
  if(mode==='count'){
    var n=rand(1,12);
    var icons=['🍎','🍌','🍇','🍓','🍊','🥝','🍉','🍍','🐶','🐱','⭐','🎈'];
    var ic=icons[Math.floor(Math.random()*icons.length)];
    var opts=shuffle([n,n+1,Math.max(1,n-1),n+2]);
    var html='<div class="text-center fs-1 my-3">'+ic.repeat(n)+'</div><p class="text-center fs-4">Quantos <strong>'+ic+'</strong>?</p><div class="math-options">';
    opts.forEach(function(o){html+='<button class="math-option" data-v="'+o+'">'+o+'</button>'});
    html+='</div>';
    c.innerHTML=html;
    c.querySelectorAll('.math-option').forEach(function(b){b.addEventListener('click',function(){check(+b.dataset.v===n,b)})});
  }else{
    var ops=['+','-','×'];
    var op=ops[Math.floor(Math.random()*3)];
    var a,b,ans;
    if(op==='+'){a=rand(1,20);b=rand(1,20);ans=a+b}
    else if(op==='-'){a=rand(1,20);b=rand(1,a);ans=a-b}
    else{a=rand(1,10);b=rand(1,10);ans=a*b}
    var opts=shuffle([ans,ans+1,Math.max(0,ans-1),ans+2]);
    var html='<div class="math-problem">'+a+' '+op+' '+b+' = ?</div><div class="math-options">';
    opts.forEach(function(o){html+='<button class="math-option" data-v="'+o+'">'+o+'</button>'});
    html+='</div>';
    c.innerHTML=html;
    c.querySelectorAll('.math-option').forEach(function(b){b.addEventListener('click',function(){check(+b.dataset.v===ans,b)})});
  }
}
function check(ok,btn){
  document.querySelectorAll('.math-option').forEach(function(b){b.disabled=true});
  if(ok){btn.classList.add('correct');S.score+=10;S.correct++;document.getElementById('score').textContent=S.score;NPAccess.feedback('success')}
  else{btn.classList.add('wrong');NPAccess.feedback('error')}
  setTimeout(next,900);
}
function finish(){
  var pct=Math.round(S.correct/S.total*100);
  var stars=pct>=90?3:pct>=60?2:1;
  var u=NPAuth.getCurrent();
  if(u){NPStorage.addProgress(u.id,{gameId:'matematica_'+mode,score:pct,duration:0});var st=NPStorage.getStudent(u.id);if(st){st.stars=(st.stars||0)+stars;st.xp=(st.xp||0)+stars*20;NPStorage.updateStudent(u.id,st)}}
  NPAccess.feedback('star');
  alert('🎉 Fim!\nAcertos: '+S.correct+'/'+S.total+'\nDesempenho: '+pct+'%\nEstrelas: '+stars+' ⭐');
  S.q=0;S.score=0;S.correct=0;document.getElementById('score').textContent=0;next();
}
next();
</script></body></html>
