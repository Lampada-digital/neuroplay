<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeuroPlay - Linguagem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
<link rel="stylesheet" href="../css/responsive.css"/><link rel="stylesheet" href="../css/games.css"/>
</head><body><div class="container py-4"><a href="../pages/jogos.html" class="btn btn-ghost mb-3"><i class="bi bi-arrow-left"></i> Voltar</a><div id="gameRoot"></div></div>
<script src="../js/storage.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>const MATCH_ITEMS=[{img:'🐶',word:'CACHORRO'},{img:'🐱',word:'GATO'},{img:'🍎',word:'MAÇÃ'},{img:'🍌',word:'BANANA'},{img:'🌞',word:'SOL'},{img:'🌙',word:'LUA'},{img:'🏠',word:'CASA'},{img:'🚗',word:'CARRO'},{img:'🌳',word:'ÁRVORE'},{img:'🐟',word:'PEIXE'}];
const SPELL_WORDS=[{word:'BOLA',hint:'Objeto redondo para brincar'},{word:'CASA',hint:'Onde moramos'},{word:'GATO',hint:'Animal que mia'},{word:'SOL',hint:'Brilha no céu de dia'},{word:'LUA',hint:'Brilha no céu à noite'},{word:'PAI',hint:'Pai de família'},{word:'AGUA',hint:'Bebemos quando temos sede'},{word:'LEITE',hint:'Bebida branca'}];
let S={mode:'match',q:0,score:0,total:8,correct:0,current:null};
function init(){const p=new URLSearchParams(location.search);S.mode=p.get('mode')==='spell'?'spell':'match';
document.getElementById('gameRoot').innerHTML='<div class="np-game-wrap"><div class="np-game-header"><div><h1 class="h4 mb-1" id="tt">'+(S.mode==='spell'?'🔤 Formação de Palavras':'🖼️ Associação Imagem/Palavra')+'</h1><p class="text-muted mb-0" id="ins">'+(S.mode==='spell'?'Monte a palavra.':'Toque na palavra correspondente.')+'</p></div><div class="np-game-stats"><div class="np-game-stat"><i class="bi bi-star-fill np-star"></i> <span id="sc">0</span></div><div class="np-game-stat">Item <span id="qn">1</span>/8</div></div></div><div id="ct"></div></div>';reset()}
function reset(){S.q=0;S.score=0;S.correct=0;document.getElementById('sc').textContent=0;next()}
function next(){S.q++;if(S.q>S.total)return finish();document.getElementById('qn').textContent=S.q;const ct=document.getElementById('ct');
if(S.mode==='match'){const it=MATCH_ITEMS[Math.floor(Math.random()*MATCH_ITEMS.length)];S.current=it;const opts=shuffle([it.word,...shuffle(MATCH_ITEMS.filter(x=>x.word!==it.word).map(x=>x.word)).slice(0,3)]);ct.innerHTML='<div class="emotion-card">'+it.img+'</div><p class="text-center fs-5">Qual é a palavra?</p><div class="emotion-options">'+opts.map(o=>'<button class="math-option" data-v="'+o+'">'+o+'</button>').join('')+'</div>';ct.querySelectorAll('.math-option').forEach(b=>b.addEventListener('click',()=>check(b.dataset.v===it.word,b)));NPAccessibility.speak('Qual é a palavra para '+it.img+'?')}
else{const it=SPELL_WORDS[Math.floor(Math.random()*SPELL_WORDS.length)];S.current=it;const letters=shuffle(it.word.split('').concat(Array.from({length:3},()=>'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)])));ct.innerHTML='<p class="text-center fs-5"><em>'+it.hint+'</em></p><div class="word-slots" id="sl">'+it.word.split('').map(() =>'<div class="word-letter"></div>').join('')+'</div><div class="word-letters" id="lt">'+letters.map((l,i)=>'<button class="word-letter-btn" data-i="'+i+'" data-l="'+l+'">'+l+'</button>').join('')+'</div><div class="text-center"><button class="btn btn-ghost" id="cw"><i class="bi bi-eraser"></i> Apagar</button></div>';bindSpell();NPAccessibility.speak(it.hint)}}
function bindSpell(){const sl=document.getElementById('sl').children;const lt=document.querySelectorAll('#lt .word-letter-btn');let placed=Array(S.current.word.length).fill(null);lt.forEach(b=>b.addEventListener('click',()=>{const idx=placed.findIndex(p=>p===null);if(idx<0)return;placed[idx]={l:b.dataset.l,i:+b.dataset.i};sl[idx].textContent=b.dataset.l;sl[idx].classList.add('filled');b.classList.add('used');b.disabled=true;NPAccessibility.clickSound();if(placed.every(p=>p!==null)){const f=placed.map(p=>p.l).join('');setTimeout(()=>check(f===S.current.word,null,f),300)}}));document.getElementById('cw').addEventListener('click',()=>{placed=Array(S.current.word.length).fill(null);Array.from(sl).forEach(s=>{s.textContent='';s.classList.remove('filled')});lt.forEach(b=>{b.classList.remove('used');b.disabled=false})})}
function check(ok,btn,formed){if(btn){document.querySelectorAll('.math-option').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong')}if(ok){S.score+=10;S.correct++;document.getElementById('sc').textContent=S.score;NPAccessibility.feedback('success')}else{NPAccessibility.feedback('error');if(S.mode==='spell')NPAccessibility.toast('A palavra era: '+S.current.word)}setTimeout(next,1000)}
function finish(){const pct=Math.round(S.correct/S.total*100);const stars=pct>=90?3:pct>=60?2:1;const p=NPStorage.getProfile();if(p){NPStorage.addProgress(p.id,{gameId:S.mode==='match'?'imagem_palavra':'formar_palavras',score:pct,duration:0,difficulty:'medium'});p.stars=(p.stars||0)+stars;NPStorage.setProfile(p)}NPAccessibility.feedback('star');alert('🎉 Fim!\\nAcertos: '+S.correct+'/'+S.total+'\\nDesempenho: '+pct+'%\\nEstrelas: '+stars+' ⭐');reset()}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
document.addEventListener('DOMContentLoaded',init);</script>
</body></html>
