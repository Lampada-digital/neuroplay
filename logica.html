<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeuroPlay - Lógica</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
<link rel="stylesheet" href="../css/responsive.css"/><link rel="stylesheet" href="../css/games.css"/>
</head><body><div class="container py-4"><a href="../pages/jogos.html" class="btn btn-ghost mb-3"><i class="bi bi-arrow-left"></i> Voltar</a><div id="gameRoot"></div></div>
<script src="../js/storage.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>const CLASSIFY_DATA=[{title:'Frutas',items:['🍎','🍌','🍇','🍓','🍊'],odd:'🥕'},{title:'Animais',items:['🐶','🐱','🐭','🐰','🦊'],odd:'🌳'},{title:'Veículos',items:['🚗','🚙','🚌','🚓','🚕'],odd:'🏠'},{title:'Esportes',items:['⚽','🏀','🏈','⚾','🎾'],odd:'🍕'}];
const SEQ_PATTERNS=[{seq:['🔴','🔵','🔴','🔵','🔴'],ans:'🔵',opts:['🔵','🔴','🟢','🟡']},{seq:['🌞','🌙','🌞','🌙','🌞'],ans:'🌙',opts:['🌙','🌞','⭐','☁️']},{seq:['1','2','3','4','5'],ans:'6',opts:['6','7','5','10']},{seq:['🐶','🐶','🐱','🐶','🐶'],ans:'🐱',opts:['🐱','🐶','🐭','🐰']},{seq:['2','4','6','8'],ans:'10',opts:['10','9','12','11']}];
let S={mode:'classify',q:0,score:0,total:8,correct:0};
function init(){const p=new URLSearchParams(location.search);S.mode=p.get('mode')==='sequence'?'sequence':'classify';
document.getElementById('gameRoot').innerHTML='<div class="np-game-wrap"><div class="np-game-header"><div><h1 class="h4 mb-1" id="tt">'+(S.mode==='sequence'?'🧵 Sequência Lógica':'🗂️ Classificação')+'</h1><p class="text-muted mb-0" id="ins">'+(S.mode==='sequence'?'Complete a sequência.':'Qual NÃO pertence?')+'</p></div><div class="np-game-stats"><div class="np-game-stat"><i class="bi bi-star-fill np-star"></i> <span id="sc">0</span></div><div class="np-game-stat">Questão <span id="qn">1</span>/8</div></div></div><div id="ct"></div></div>';reset()}
function reset(){S.q=0;S.score=0;S.correct=0;document.getElementById('sc').textContent=0;next()}
function next(){S.q++;if(S.q>S.total)return finish();document.getElementById('qn').textContent=S.q;const ct=document.getElementById('ct');
if(S.mode==='classify'){const d=CLASSIFY_DATA[Math.floor(Math.random()*CLASSIFY_DATA.length)];const opts=shuffle([d.odd,...d.items.slice(0,3)]);ct.innerHTML='<p class="text-center fs-5">Grupo: <strong>'+d.title+'</strong></p><div class="text-center fs-1 my-3">'+d.items.join(' ')+'</div><p class="text-center">Qual NÃO pertence?</p><div class="math-options">'+opts.map(o=>'<button class="math-option" data-v="'+o+'">'+o+'</button>').join('')+'</div>';ct.querySelectorAll('.math-option').forEach(b=>b.addEventListener('click',()=>check(b.dataset.v===d.odd,b)))}
else{const d=SEQ_PATTERNS[Math.floor(Math.random()*SEQ_PATTERNS.length)];ct.innerHTML='<div class="text-center fs-1 my-3">'+d.seq.join(' ')+' <strong style="color:var(--np-purple)">?</strong></div><p class="text-center">Complete:</p><div class="math-options">'+shuffle(d.opts).map(o=>'<button class="math-option" data-v="'+o+'">'+o+'</button>').join('')+'</div>';ct.querySelectorAll('.math-option').forEach(b=>b.addEventListener('click',()=>check(b.dataset.v===d.ans,b)))}}
function check(ok,btn){document.querySelectorAll('.math-option').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');if(ok){S.score+=10;S.correct++;document.getElementById('sc').textContent=S.score;NPAccessibility.feedback('success')}else NPAccessibility.feedback('error');setTimeout(next,900)}
function finish(){const pct=Math.round(S.correct/S.total*100);const stars=pct>=90?3:pct>=60?2:1;const p=NPStorage.getProfile();if(p){NPStorage.addProgress(p.id,{gameId:S.mode==='classify'?'classificacao':'sequencia_logica',score:pct,duration:0,difficulty:'medium'});p.stars=(p.stars||0)+stars;NPStorage.setProfile(p)}NPAccessibility.feedback('star');alert('🎉 Fim!\\nAcertos: '+S.correct+'/'+S.total+'\\nDesempenho: '+pct+'%\\nEstrelas: '+stars+' ⭐');reset()}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
document.addEventListener('DOMContentLoaded',init);</script>
</body></html>
