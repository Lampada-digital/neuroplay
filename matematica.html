<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeuroPlay - Matemática</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
<link rel="stylesheet" href="../css/responsive.css"/><link rel="stylesheet" href="../css/games.css"/>
</head><body><div class="container py-4"><a href="../pages/jogos.html" class="btn btn-ghost mb-3"><i class="bi bi-arrow-left"></i> Voltar</a><div id="gameRoot"></div></div>
<script src="../js/storage.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>let S={mode:'ops',q:0,score:0,total:10,diff:'medium',correct:0};
const MAX={very_easy:5,easy:10,medium:20,hard:50,advanced:100};
function init(){const p=new URLSearchParams(location.search);S.mode=p.get('mode')==='count'?'count':'ops';const profile=NPStorage.getProfile()||{};S.diff=profile.difficulty||'medium';
document.getElementById('gameRoot').innerHTML='<div class="np-game-wrap"><div class="np-game-header"><div><h1 class="h4 mb-1" id="tt">'+(S.mode==='count'?'🧮 Número e Quantidade':'➕ Matemática Divertida')+'</h1><p class="text-muted mb-0" id="ins">'+(S.mode==='count'?'Conte e escolha o número certo.':'Resolva as operações.')+'</p></div><div class="np-game-stats"><div class="np-game-stat"><i class="bi bi-star-fill np-star"></i> <span id="sc">0</span></div><div class="np-game-stat">Questão <span id="qn">1</span>/10</div></div></div><div class="d-flex gap-2 mb-3 flex-wrap"><select class="form-select form-select-sm" id="ds" style="max-width:180px"></select><button class="btn btn-np" id="rs"><i class="bi bi-arrow-clockwise"></i> Reiniciar</button></div><div id="ct"></div></div>';
NPCatalog.DIFFICULTIES.forEach(d=>document.getElementById('ds').insertAdjacentHTML('beforeend','<option value="'+d.id+'" '+(d.id===S.diff?'selected':'')+'>'+d.label+'</option>'));
document.getElementById('ds').addEventListener('change',e=>{S.diff=e.target.value;reset()});document.getElementById('rs').addEventListener('click',reset);reset()}
function reset(){S.q=0;S.score=0;S.correct=0;document.getElementById('sc').textContent=0;next()}
function next(){S.q++;if(S.q>S.total)return finish();document.getElementById('qn').textContent=S.q;const ct=document.getElementById('ct');const max=MAX[S.diff];
if(S.mode==='count'){const n=Math.floor(Math.random()*Math.min(max,12))+1;const icons=['🍎','🍌','🍇','🍓','🍊','🥝','🍉','🍍','🐶','🐱','⭐','🎈'];const ic=icons[Math.floor(Math.random()*icons.length)];const opts=shuffle([n,n+1,Math.max(1,n-1),n+2]);ct.innerHTML='<div class="text-center fs-2 my-3">'+ic.repeat(n)+'</div><p class="text-center fs-5">Quantos <strong>'+ic+'</strong>?</p><div class="math-options">'+opts.map(o=>'<button class="math-option" data-v="'+o+'">'+o+'</button>').join('')+'</div>';ct.querySelectorAll('.math-option').forEach(b=>b.addEventListener('click',()=>check(+b.dataset.v===n,b)))}
else{const ops=['+','-','×'];const op=ops[Math.floor(Math.random()*(S.diff==='very_easy'?1:S.diff==='easy'?2:3))];let a,b,ans;if(op==='+'){a=rand(1,max);b=rand(1,max);ans=a+b}else if(op==='-'){a=rand(1,max);b=rand(1,a);ans=a-b}else{a=rand(1,12);b=rand(1,12);ans=a*b}const opts=shuffle([ans,ans+1,Math.max(0,ans-1),ans+2]);ct.innerHTML='<div class="math-problem">'+a+' '+op+' '+b+' = ?</div><div class="math-options">'+opts.map(o=>'<button class="math-option" data-v="'+o+'">'+o+'</button>').join('')+'</div>';ct.querySelectorAll('.math-option').forEach(b=>b.addEventListener('click',()=>check(+b.dataset.v===ans,b)));NPAccessibility.speak('Quanto é '+a+' '+(op==='+'?'mais':op==='-'?'menos':'vezes')+' '+b+'?')}}
function check(ok,btn){document.querySelectorAll('.math-option').forEach(b=>b.disabled=true);if(ok){btn.classList.add('correct');S.score+=10;S.correct++;document.getElementById('sc').textContent=S.score;NPAccessibility.feedback('success')}else{btn.classList.add('wrong');NPAccessibility.feedback('error')}setTimeout(next,900)}
function finish(){const pct=Math.round(S.correct/S.total*100);const stars=pct>=90?3:pct>=60?2:1;const p=NPStorage.getProfile();if(p){NPStorage.addProgress(p.id,{gameId:S.mode==='count'?'num_quantidade':'matematica_ops',score:pct,duration:0,difficulty:S.diff});p.stars=(p.stars||0)+stars;NPStorage.setProfile(p);const ac=NPStorage.getAchievements(p.id);const mc=NPStorage.getProgress(p.id).filter(x=>x.gameId==='matematica_ops').length;if(mc>=20&&!ac.find(a=>a.id==='math_whiz'))NPStorage.addAchievement(p.id,NPCatalog.ACHIEVEMENTS.find(a=>a.id==='math_whiz'))}NPAccessibility.feedback('star');alert('🎉 Fim!\\nAcertos: '+S.correct+'/'+S.total+'\\nDesempenho: '+pct+'%\\nEstrelas: '+stars+' ⭐');reset()}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
document.addEventListener('DOMContentLoaded',init);</script>
</body></html>
