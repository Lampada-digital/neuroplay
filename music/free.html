<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Criar Música</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
</head><body>
<div class="container py-4">
  <a href="../pages/aluno/music.html" class="btn btn-ghost mb-3">← Voltar</a>
  <div class="card text-center">
    <h2>🎼 Criar Minha Música</h2>
    <p class="text-muted">Modo livre - toque o que quiser!</p>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin:2rem 0" id="notes"></div>
  </div>
</div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>
var NOTES=['DÓ','RÉ','MI','FÁ','SOL','LÁ','SI','DÓ'];
var FREQS=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];
var ctx;
function getCtx(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx}
var notesHtml='';
NOTES.forEach(function(n,i){notesHtml+='<button class="btn btn-primary btn-lg" data-i="'+i+'" style="min-width:80px">'+n+'</button>'});
document.getElementById('notes').innerHTML=notesHtml;
document.querySelectorAll('#notes button').forEach(function(b){b.addEventListener('click',function(){
  var i=+b.dataset.i;
  var c=getCtx();var o=c.createOscillator();var g=c.createGain();
  o.frequency.value=FREQS[i];g.gain.value=.2;
  o.connect(g);g.connect(c.destination);o.start();setTimeout(function(){o.stop();c.close()},400);
  b.style.transform='scale(.9)';setTimeout(function(){b.style.transform=''},150);
})});
</script></body></html>
