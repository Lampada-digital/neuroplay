<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/style.css"/><link rel="stylesheet" href="../../css/dashboard.css"/><link rel="stylesheet" href="../../css/accessibility.css"/>
</head><body><div id="app"></div>
<script src="../../js/storage.js"></script><script src="../../js/auth.js"></script><script src="../../js/accessibility.js"></script><script src="../../js/app.js"></script>
<script>
if(!NPAuth.isLoggedIn())location.href='../auth/login.html';
var user=NPAuth.getCurrent();
var users=NPStorage.getUsers();
var students=NPStorage.getStudents();
var logs=NPStorage.getLogs();
var content='<div class="welcome-banner"><div><h2>Administração 🏫</h2><p>Controle total</p></div></div>';
content+='<div class="stats-grid">';
content+='<div class="stat-card"><div class="stat-icon purple">👥</div><div class="stat-content"><h3>'+users.length+'</h3><p>Usuários</p></div></div>';
content+='<div class="stat-card"><div class="stat-icon green">👨‍🎓</div><div class="stat-content"><h3>'+students.length+'</h3><p>Alunos</p></div></div>';
content+='<div class="stat-card"><div class="stat-icon blue">🎮</div><div class="stat-content"><h3>'+NPCatalog.GAMES.length+'</h3><p>Jogos</p></div></div>';
content+='<div class="stat-card"><div class="stat-icon orange">📋</div><div class="stat-content"><h3>'+logs.length+'</h3><p>Logs</p></div></div>';
content+='</div>';
content+='<div class="card"><h3 class="mb-3">📋 Logs recentes</h3><div class="activity-list">';
if(logs.length===0)content+='<p class="text-muted">Nenhum log</p>';
else{
  logs.slice(-5).reverse().forEach(function(l){
    content+='<div class="activity-item"><div class="activity-icon">📝</div><div class="activity-content"><div class="activity-title">'+l.action+'</div><div class="activity-meta">'+new Date(l.date).toLocaleString('pt-BR')+'</div></div></div>';
  });
}
content+='</div></div>';
document.getElementById('app').innerHTML=NPApp.renderLayout('admin','dashboard.html','Administração',content);
document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
</script></body></html>
