<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Conquistas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/style.css"/><link rel="stylesheet" href="../../css/dashboard.css"/><link rel="stylesheet" href="../../css/accessibility.css"/>
</head><body><div id="app"></div>
<script src="../../js/storage.js"></script><script src="../../js/auth.js"></script><script src="../../js/accessibility.js"></script><script src="../../js/app.js"></script>
<script>
if(!NPAuth.isLoggedIn())location.href='../auth/login.html';
var user=NPAuth.getCurrent();
var unlocked=NPStorage.getAchievements(user.id);
var ids=unlocked.map(function(a){return a.id});
var content='<div class="areas-grid">';
NPCatalog.ACHIEVEMENTS.forEach(function(a){
  var got=ids.indexOf(a.id)>=0;
  content+='<div class="area-card" style="opacity:'+(got?'1':'.5')+'"><span class="area-icon">'+(got?a.icon:'🔒')+'</span><div class="area-title">'+a.title+'</div><div class="area-desc">'+a.desc+'</div></div>';
});
content+='</div>';
document.getElementById('app').innerHTML=NPApp.renderLayout('aluno','achievements.html','🏆 Conquistas',content);
document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
</script></body></html>
