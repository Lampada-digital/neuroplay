<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Animais</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/style.css"/><link rel="stylesheet" href="../../css/dashboard.css"/><link rel="stylesheet" href="../../css/accessibility.css"/>
</head><body><div id="app"></div>
<script src="../../js/storage.js"></script><script src="../../js/auth.js"></script><script src="../../js/accessibility.js"></script><script src="../../js/app.js"></script>
<script>
if(!NPAuth.isLoggedIn())location.href='../auth/login.html';
var content='<div class="card"><h3>🐶 Mundo dos Animais</h3><p class="text-muted mb-3">Clique para conhecer</p><div class="areas-grid">';
NPCatalog.ANIMALS.forEach(function(a){
  content+='<div class="area-card" onclick="showAnimal(\''+a.name+'\')"><span class="area-icon">'+a.emoji+'</span><div class="area-title">'+a.name+'</div><div class="area-desc">'+a.habitat+'</div></div>';
});
content+='</div></div>';
window.showAnimal=function(name){
  var a=NPCatalog.ANIMALS.find(function(x){return x.name===name});
  if(!a)return;
  var m=document.createElement('div');
  m.className='modal-backdrop';
  m.innerHTML='<div class="modal"><div style="text-align:center;font-size:6rem">'+a.emoji+'</div><h2 style="text-align:center;margin:1rem 0">'+a.name+'</h2><p style="text-align:center;font-size:1.5rem;color:var(--np-primary);font-weight:700">'+a.sound+'</p><div style="background:var(--np-bg);padding:1rem;border-radius:var(--np-radius);margin:1rem 0"><strong>Habitat:</strong> '+a.habitat+'</div><div style="background:var(--np-bg);padding:1rem;border-radius:var(--np-radius);margin-bottom:1rem"><strong>Curiosidade:</strong> '+a.fact+'</div><button class="btn btn-primary" style="width:100%" onclick="this.closest(\'.modal-backdrop\').remove()">Fechar</button></div>';
  document.body.appendChild(m);
  NPAccess.speak(a.name+'. '+a.sound);
};
document.getElementById('app').innerHTML=NPApp.renderLayout('aluno','animals.html','🐶 Animais',content);
document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
</script></body></html>
