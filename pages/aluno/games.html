<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Jogos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/style.css"/><link rel="stylesheet" href="../../css/dashboard.css"/><link rel="stylesheet" href="../../css/accessibility.css"/>
</head><body><div id="app"></div>
<script src="../../js/storage.js"></script><script src="../../js/auth.js"></script><script src="../../js/accessibility.js"></script><script src="../../js/app.js"></script>
<script>
if(!NPAuth.isLoggedIn())location.href='../auth/login.html';
var user=NPAuth.getCurrent();
var student=NPStorage.getStudent(user.id)||{age:8};
var games=NPCatalog.getGamesForAge(ageToBand(student.age||8));
var content='<p class="text-muted mb-3">Jogos para sua idade</p><div class="areas-grid">';
games.forEach(function(g){content+='<a href="../../'+g.href+'" class="area-card"><span class="area-icon">'+g.icon+'</span><div class="area-title">'+g.title+'</div><div class="area-desc">'+g.skills.join(', ')+'</div></a>'});
content+='</div>';
document.getElementById('app').innerHTML=NPApp.renderLayout('aluno','games.html','🎮 Jogos',content);
document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
</script></body></html>
