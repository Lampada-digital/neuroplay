<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Biblioteca</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/style.css"/><link rel="stylesheet" href="../../css/dashboard.css"/><link rel="stylesheet" href="../../css/accessibility.css"/>
</head><body><div id="app"></div>
<script src="../../js/storage.js"></script><script src="../../js/auth.js"></script><script src="../../js/accessibility.js"></script><script src="../../js/app.js"></script>
<script>
if(!NPAuth.isLoggedIn())location.href='../auth/login.html';
var read=NPStorage.getStoriesRead();
var content='<p class="text-muted mb-3">Escolha uma história</p><div class="areas-grid">';
NPCatalog.STORIES.forEach(function(s){
  var done=read.indexOf(s.id)>=0;
  content+='<a href="../../reading/story.html?id='+s.id+'" class="area-card" style="position:relative"><span class="area-icon">'+s.icon+'</span><div class="area-title">'+s.title+'</div><div class="area-desc">'+s.pages.length+' páginas</div>';
  if(done)content+='<div style="position:absolute;top:10px;right:10px;background:var(--np-success);color:white;padding:4px 8px;border-radius:999px;font-size:.75rem">✓</div>';
  content+='</a>';
});
content+='</div>';
document.getElementById('app').innerHTML=NPApp.renderLayout('aluno','reading.html','📚 Biblioteca',content);
document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
</script></body></html>
