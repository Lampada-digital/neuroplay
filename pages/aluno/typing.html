<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Digitação</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/style.css"/><link rel="stylesheet" href="../../css/dashboard.css"/><link rel="stylesheet" href="../../css/accessibility.css"/>
</head><body><div id="app"></div>
<script src="../../js/storage.js"></script><script src="../../js/auth.js"></script><script src="../../js/accessibility.js"></script><script src="../../js/app.js"></script>
<script>
if(!NPAuth.isLoggedIn())location.href='../auth/login.html';
var content='<div class="card"><h3>⌨️ Aprendendo a Digitar</h3><p class="text-muted mb-3">Aprenda progressivamente</p><div class="areas-grid">';
for(var i=1;i<=6;i++){
  var titles=['Letras','Palavras','Frases','Pontuação','Velocidade','Precisão'];
  content+='<a href="../../typing/level'+i+'.html" class="area-card"><span class="area-icon">'+i+'️⃣</span><div class="area-title">Nível '+i+'</div><div class="area-desc">'+titles[i-1]+'</div></a>';
}
content+='</div></div>';
document.getElementById('app').innerHTML=NPApp.renderLayout('aluno','typing.html','⌨️ Digitação',content);
document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
</script></body></html>
