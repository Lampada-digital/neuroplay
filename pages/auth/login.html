<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>NEUROPLAY - Entrar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/style.css"/><link rel="stylesheet" href="../../css/accessibility.css"/>
</head><body style="background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem">
<div style="background:white;border-radius:24px;padding:3rem;max-width:450px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)">
  <div style="text-align:center;margin-bottom:2rem">
    <div style="font-size:3rem;margin-bottom:.5rem">🧠</div>
    <h1 style="font-size:1.75rem;margin-bottom:.5rem">Bem-vindo de volta!</h1>
    <p class="text-muted">Entre na sua conta</p>
  </div>
  <form id="loginForm">
    <div class="form-group"><label class="form-label">E-mail</label><input type="email" class="form-control" id="email" required placeholder="seu@email.com"/></div>
    <div class="form-group"><label class="form-label">Senha</label><input type="password" class="form-control" id="password" required/></div>
    <button type="submit" class="btn btn-primary" style="width:100%;margin-bottom:1rem">Entrar</button>
    <div style="text-align:center;margin:1.5rem 0;color:var(--np-text-light);font-size:.875rem">ou continue com</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1.5rem">
      <button type="button" class="btn btn-ghost" onclick="alert('OAuth requer backend')">Google</button>
      <button type="button" class="btn btn-ghost" onclick="alert('OAuth requer backend')">Microsoft</button>
      <button type="button" class="btn btn-ghost" onclick="alert('OAuth requer backend')">Apple</button>
    </div>
    <p style="text-align:center;font-size:.875rem">Não tem conta? <a href="register.html" style="color:var(--np-primary);font-weight:600">Cadastre-se</a></p>
  </form>
</div>
<script src="../../js/storage.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/accessibility.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  NPAuth.login(document.getElementById('email').value,document.getElementById('password').value).then(function(user){
    NPAccess.toast('Bem-vindo, '+user.name+'!','success');
    setTimeout(function(){
      var routes={student:'../aluno/dashboard.html',parent:'../responsavel/dashboard.html',teacher:'../professor/dashboard.html',admin:'../admin/dashboard.html'};
      location.href=routes[user.role]||'../aluno/dashboard.html';
    },800);
  }).catch(function(err){NPAccess.toast(err.message,'error')});
});
</script>
</body></html>
