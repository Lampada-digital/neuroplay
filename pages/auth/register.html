<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>NEUROPLAY - Cadastro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/style.css"/><link rel="stylesheet" href="../../css/accessibility.css"/>
</head><body style="background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem">
<div style="background:white;border-radius:24px;padding:3rem;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)">
  <div style="text-align:center;margin-bottom:2rem">
    <div style="font-size:3rem;margin-bottom:.5rem">🧠</div>
    <h1 style="font-size:1.75rem;margin-bottom:.5rem">Criar conta</h1>
    <p class="text-muted">Junte-se à NEUROPLAY</p>
  </div>
  <form id="registerForm">
    <div class="form-group"><label class="form-label">Tipo de conta</label>
      <select class="form-control" id="role" required>
        <option value="student">👧 Aluno</option>
        <option value="parent">👨‍👩‍👧 Pai/Mãe/Responsável</option>
        <option value="teacher">👩‍🏫 Professor(a)</option>
        <option value="admin">🏫 Administrador(a)</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Nome completo</label><input type="text" class="form-control" id="name" required/></div>
    <div class="form-group" id="ageGroup"><label class="form-label">Idade</label><input type="number" class="form-control" id="age" min="3" max="99" value="8"/></div>
    <div class="form-group"><label class="form-label">E-mail</label><input type="email" class="form-control" id="email" required/></div>
    <div class="form-group"><label class="form-label">Senha</label><input type="password" class="form-control" id="password" required minlength="6"/></div>
    <button type="submit" class="btn btn-primary" style="width:100%;margin-bottom:1rem">Criar conta</button>
    <p style="text-align:center;font-size:.875rem">Já tem conta? <a href="login.html" style="color:var(--np-primary);font-weight:600">Entrar</a></p>
  </form>
</div>
<script src="../../js/storage.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/accessibility.js"></script>
<script>
var params=new URLSearchParams(location.search);
if(params.get('role'))document.getElementById('role').value=params.get('role');
document.getElementById('role').addEventListener('change',function(e){
  document.getElementById('ageGroup').style.display=e.target.value==='student'?'block':'none';
});
document.getElementById('registerForm').addEventListener('submit',function(e){
  e.preventDefault();
  var role=document.getElementById('role').value;
  var data={name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value,role:role};
  if(role==='student'){data.age=+document.getElementById('age').value;data.support=2;data.difficulty='medium';data.skills=[];data.stars=0;data.xp=0;data.level=1;data.avatar='🦊'}
  NPAuth.register(data).then(function(user){
    if(role==='student'){NPStorage.addStudent({id:user.id,userId:user.id,name:user.name,age:data.age,support:data.support,difficulty:data.difficulty,skills:data.skills,stars:0,xp:0,level:1})}
    NPAccess.toast('Conta criada!','success');
    setTimeout(function(){
      var routes={student:'../aluno/dashboard.html',parent:'../responsavel/dashboard.html',teacher:'../professor/dashboard.html',admin:'../admin/dashboard.html'};
      location.href=routes[user.role];
    },800);
  }).catch(function(err){NPAccess.toast(err.message,'error')});
});
</script>
</body></html>
