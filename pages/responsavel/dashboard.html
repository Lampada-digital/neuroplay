<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Pais</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/style.css"/><link rel="stylesheet" href="../../css/dashboard.css"/><link rel="stylesheet" href="../../css/accessibility.css"/>
</head><body><div id="app"></div>
<script src="../../js/storage.js"></script><script src="../../js/auth.js"></script><script src="../../js/accessibility.js"></script><script src="../../js/app.js"></script>
<script>
if(!NPAuth.isLoggedIn())location.href='../auth/login.html';
var user=NPAuth.getCurrent();
var students=NPStorage.getStudents();
var content='<div class="welcome-banner"><div><h2>Olá, '+user.name+'! 👋</h2><p>Acompanhe a jornada</p></div></div>';
content+='<div class="stats-grid">';
content+='<div class="stat-card"><div class="stat-icon purple">👨‍👩‍👧</div><div class="stat-content"><h3>'+students.length+'</h3><p>Filhos</p></div></div>';
var totalAtiv=students.reduce(function(s,x){return s+NPStorage.getProgress(x.id).length},0);
content+='<div class="stat-card"><div class="stat-icon green">✓</div><div class="stat-content"><h3>'+totalAtiv+'</h3><p>Atividades</p></div></div>';
var totalStars=students.reduce(function(s,x){return s+(x.stars||0)},0);
content+='<div class="stat-card"><div class="stat-icon blue">⭐</div><div class="stat-content"><h3>'+totalStars+'</h3><p>Estrelas</p></div></div>';
content+='</div>';
content+='<div class="card"><h3 class="mb-3">👨‍👩‍👧 Meus filhos</h3>';
if(students.length===0)content+='<p class="text-muted">Nenhum filho vinculado</p>';
else{
  content+='<div class="activity-list">';
  students.forEach(function(s){
    content+='<div class="activity-item"><div class="activity-icon">👤</div><div class="activity-content"><div class="activity-title">'+s.name+'</div><div class="activity-meta">'+s.age+' anos · '+NPStorage.getProgress(s.id).length+' atividades</div></div></div>';
  });
  content+='</div>';
}
content+='</div>';
document.getElementById('app').innerHTML=NPApp.renderLayout('parent','dashboard.html','Dashboard Familiar',content);
document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
</script></body></html>
