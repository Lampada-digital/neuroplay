<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>História</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
<style>
.reader{max-width:800px;margin:2rem auto;padding:2rem;background:var(--np-surface);border-radius:24px;box-shadow:var(--np-shadow-lg);min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.reader-img{font-size:10rem;margin:2rem 0}
.reader-text{font-size:1.75rem;line-height:1.6;margin:2rem 0;max-width:600px}
.reader-controls{display:flex;gap:1rem;margin-top:2rem;flex-wrap:wrap;justify-content:center}
.progress-dots{display:flex;gap:.5rem;margin:1rem 0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--np-border)}
.dot.active{background:var(--np-primary)}
.dot.read{background:var(--np-success)}
</style>
</head><body>
<div class="container">
  <a href="../pages/aluno/reading.html" class="btn btn-ghost mt-3">← Voltar</a>
  <div class="reader">
    <h2 id="title"></h2>
    <div class="progress-dots" id="dots"></div>
    <div class="reader-img" id="img"></div>
    <div class="reader-text" id="text"></div>
    <div class="reader-controls">
      <button class="btn btn-ghost" id="prev">← Anterior</button>
      <button class="btn btn-primary" id="speak">🔊 Ouvir</button>
      <button class="btn btn-primary" id="next">Próxima →</button>
    </div>
  </div>
</div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>
var id=new URLSearchParams(location.search).get('id');
var story=NPCatalog.STORIES.find(function(s){return s.id===id});
if(!story){document.body.innerHTML='<div class="container py-5 text-center"><h2>História não encontrada</h2><a href="../pages/aluno/reading.html" class="btn btn-primary mt-3">Voltar</a></div>'}
var page=0;
function render(){
  document.getElementById('title').textContent=story.title;
  document.getElementById('img').textContent=story.pages[page].img;
  document.getElementById('text').textContent=story.pages[page].text;
  var dotsHtml='';
  for(var i=0;i<story.pages.length;i++){
    var cls='dot';
    if(i===page)cls+=' active';
    else if(i<page)cls+=' read';
    dotsHtml+='<div class="'+cls+'"></div>';
  }
  document.getElementById('dots').innerHTML=dotsHtml;
  document.getElementById('prev').disabled=page===0;
  document.getElementById('next').innerHTML=page===story.pages.length-1?'Final ✓':'Próxima →';
}
document.getElementById('prev').addEventListener('click',function(){if(page>0){page--;render()}});
document.getElementById('next').addEventListener('click',function(){
  if(page<story.pages.length-1){page++;render()}
  else{
    var u=NPAuth.getCurrent();
    if(u){
      NPStorage.markStoryRead(story.id);
      NPStorage.addProgress(u.id,{gameId:'story_'+story.id,score:100,duration:0});
      var st=NPStorage.getStudent(u.id);
      if(st){st.stars=(st.stars||0)+2;st.xp=(st.xp||0)+30;NPStorage.updateStudent(u.id,st);
        var ac=NPStorage.getAchievements(u.id);
        var readCount=NPStorage.getStoriesRead().length;
        if(readCount>=3&&!ac.find(function(a){return a.id==='reader'}))NPStorage.addAchievement(u.id,NPCatalog.ACHIEVEMENTS.find(function(a){return a.id==='reader'}));
      }
    }
    NPAccess.feedback('star');
    alert('🎉 História concluída!\nEstrelas: 2 ⭐');
    location.href='../pages/aluno/reading.html';
  }
});
document.getElementById('speak').addEventListener('click',function(){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(story.pages[page].text);
    u.lang='pt-BR';u.rate=.85;
    window.speechSynthesis.speak(u);
  }
});
render();
</script></body></html>
