<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeuroPlay - Relatórios</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/><link rel="stylesheet" href="../css/responsive.css"/>
</head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/storage.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="../js/recommendations.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{const students=NPStorage.getStudents();
const content='<div class="np-card mb-4"><label class="form-label fw-bold">Selecione o aluno</label><select class="form-select" id="sel"><option value="">— escolha —</option>'+students.map(s=>'<option value="'+s.id+'">'+s.name+' ('+s.age+' anos)</option>').join('')+'</select></div><div id="ra"></div>';
document.getElementById('app').innerHTML=NPApp.renderLayout('professor','relatorios.html','Relatórios',content);NPApp.initSidebarToggle();
document.getElementById('sel').addEventListener('change',e=>renderReport(e.target.value))});
function renderReport(id){const a=document.getElementById('ra');if(!id){a.innerHTML='';return}const s=NPStorage.getStudent(id);if(!s){a.innerHTML='';return}
const prog=NPStorage.getProgress(id)||[];const achs=NPStorage.getAchievements(id)||[];const cls=NPStorage.getClasses().find(c=>c.id===s.classId);
const avg=prog.length?Math.round(prog.reduce((x,p)=>x+(p.score||0),0)/prog.length):0;const tT=prog.reduce((x,p)=>x+(p.duration||0),0);
const recs=NPRecommend.recommend(s);
a.innerHTML='<div class="np-card mb-3" id="rc"><div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3"><div><h2 class="h4 mb-1"><i class="bi bi-file-earmark-text text-np"></i> Relatório individual</h2><p class="text-muted mb-0">Gerado em '+new Date().toLocaleString('pt-BR')+'</p></div><div class="d-flex gap-2"><button class="btn btn-np-outline" id="bp"><i class="bi bi-printer"></i> Imprimir</button><button class="btn btn-np" id="bd"><i class="bi bi-download"></i> Baixar</button></div></div><div class="row g-3 mb-3"><div class="col-md-6"><h3 class="h6 fw-bold">Dados do aluno</h3><ul class="list-unstyled mb-0"><li><strong>Nome:</strong> '+s.name+'</li><li><strong>Idade:</strong> '+s.age+' anos</li><li><strong>Turma:</strong> '+(cls?.name||'-')+'</li><li><strong>Suporte:</strong> '+(NPCatalog.SUPPORTS.find(x=>x.id===s.support)?.label)+'</li><li><strong>Dificuldade:</strong> '+(NPCatalog.DIFFICULTIES.find(x=>x.id===s.difficulty)?.label)+'</li><li><strong>Habilidades:</strong> '+((s.skills||[]).join(', ')||'-')+'</li></ul></div><div class="col-md-6"><h3 class="h6 fw-bold">Resumo</h3><ul class="list-unstyled mb-0"><li><strong>Atividades:</strong> '+prog.length+'</li><li><strong>Desempenho médio:</strong> '+avg+'%</li><li><strong>Tempo total:</strong> '+Math.round(tT/60000)+' min</li><li><strong>Estrelas:</strong> '+(s.stars||0)+'</li><li><strong>Conquistas:</strong> '+achs.length+'</li></ul></div></div><h3 class="h6 fw-bold mt-3">Histórico</h3>'+(prog.length===0?'<p class="text-muted">Nenhuma atividade.</p>':'<div class="table-responsive"><table class="np-table"><thead><tr><th>Data</th><th>Jogo</th><th>Pontos</th><th>Tempo</th></tr></thead><tbody>'+prog.slice().reverse().map(p=>{const g=NPCatalog.getGame(p.gameId);return '<tr><td>'+new Date(p.date).toLocaleString('pt-BR')+'</td><td>'+(g?g.icon+' '+g.title:p.gameId)+'</td><td>'+(p.score??'-')+'%</td><td>'+(p.duration?Math.round(p.duration/1000)+'s':'-')+'</td></tr>'}).join('')+'</tbody></table></div>')+'<h3 class="h6 fw-bold mt-4">Recomendadas</h3><div class="np-game-grid">'+recs.slice(0,4).map(g=>'<div class="np-game-card"><div class="np-game-icon" style="background:'+g.color+'">'+g.icon+'</div><strong>'+g.title+'</strong><small class="text-muted">'+(NPCatalog.DIFFICULTIES.find(d=>d.id===g.suggestedDifficulty)?.label)+'</small></div>').join('')+'</div></div>';
document.getElementById('bp').onclick=()=>window.print();
document.getElementById('bd').onclick=()=>{const h=document.getElementById('rc').outerHTML;const f='<!doctype html><html><head><meta charset="utf-8"><title>Relatório '+s.name+'</title><style>body{font-family:system-ui;padding:24px;max-width:900px;margin:auto}table{width:100%;border-collapse:collapse}th,td{padding:6px 10px;border-bottom:1px solid #ddd;text-align:left}h2,h3{color:#6C5CE7}.np-game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.np-game-card{border:1px solid #ddd;border-radius:8px;padding:8px;text-align:center}.np-game-icon{width:48px;height:48px;border-radius:10px;margin:0 auto 6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem}</style></head><body>'+h+'</body></html>';const b=new Blob([f],{type:'text/html'});const u=URL.createObjectURL(b);const x=document.createElement('a');x.href=u;x.download='relatorio-'+s.name.replace(/\s+/g,'-')+'.html';x.click();URL.revokeObjectURL(u);NPAccessibility.toast('Baixado!')}}
</script>
</body></html>
