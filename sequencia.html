<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>NeuroPlay - Sequência</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
<link rel="stylesheet" href="../css/responsive.css"/><link rel="stylesheet" href="../css/games.css"/>
</head><body><div class="container py-4"><a href="../pages/jogos.html" class="btn btn-ghost mb-3"><i class="bi bi-arrow-left"></i> Voltar</a><div id="gameRoot"></div></div>
<script src="../js/storage.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>let S={mode:'colors',level:1,score:0,seq:[],input:[],playing:false,diff:'medium'};
const BASE_LEN={very_easy:2,easy:3,medium:4,hard:5,advanced:6};
function init(){const p=new URLSearchParams(location.search);S.mode=p.get('mode')==='numbers'?'numbers':'colors';const profile=NPStorage.getProfile()||{};S.diff=profile.difficulty||'medium';
document.getElementById('gameRoot').innerHTML='<div class="np-game-wrap"><div class="np-game-header"><div><h1 class="h4 mb-1" id="tt">'+(S.mode==='numbers'?'🔢 Sequência Numérica':'🎨 Sequência de Cores')+'</h1><p class="text-muted mb-0" id="ins">'+(S.mode==='numbers'?'Memorize os números e repita.':'Observe a sequência e repita.')+'</p></div><div class="np-game-stats"><div class="np-game-stat">Nível <span id="lv">1</span></div><div class="np-game-stat"><i class="bi bi-star-fill np-star"></i> <span id="sc">0</span></div></div></div><div class="d-flex gap-2 mb-3 flex-wrap"><select class="form-select form-select-sm" id="ds" style="max-width:180px"></select><button class="btn btn-np" id="rs"><i class="bi bi-arrow-clockwise"></i> Reiniciar</button></div><div id="st" class="text-center my-3 fs-5 fw-bold">Observando...</div><div id="pd"></div><div id="np" class="math-options" hidden></div></div>';
NPCatalog.DIFFICULTIES.forEach(d=>document.getElementById('ds').insertAdjacentHTML('beforeend','<option value="'+d.id+'" '+(d.id===S.diff?'selected':'')+'>'+d.label+'</option>'));
document.getElementById('ds').addEventListener('change',e=>{S.diff=e.target.value;reset()});document.getElementById('rs').addEventListener('click',reset);buildPad();reset()}
function buildPad(){const pd=document.getElementById('pd'),np=document.getElementById('np');if(S.mode==='colors'){np.hidden=true;pd.hidden=false;pd.innerHTML='<div class="sequence-pad"><button class="seq-btn" data-c="red"></button><button class="seq-btn" data-c="green"></button><button class="seq-btn" data-c="yellow"></button><button class="seq-btn" data-c="blue"></button></div>';pd.querySelectorAll('.seq-btn').forEach(b=>b.addEventListener('click',()=>onInput(b.dataset.c)))}else{pd.hidden=true;np.hidden=false;np.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>'<button class="math-option" data-n="'+n+'">'+n+'</button>').join('');np.querySelectorAll('.math-option').forEach(b=>b.addEventListener('click',()=>onInput(+b.dataset.n)))}}
function reset(){S.level=1;S.score=0;S.seq=[];document.getElementById('sc').textContent=0;document.getElementById('lv').textContent=1;nextRound()}
function nextRound(){const base=BASE_LEN[S.diff];const len=base+S.level-1;S.seq=[];for(let i=0;i<len;i++)S.seq.push(S.mode==='colors'?['red','green','yellow','blue'][Math.floor(Math.random()*4)]:Math.floor(Math.random()*9)+1);S.input=[];playSeq()}
function playSeq(){S.playing=true;document.getElementById('st').textContent='Observando...';let i=0;const iv=setInterval(()=>{if(i>=S.seq.length){clearInterval(iv);S.playing=false;document.getElementById('st').textContent='Sua vez!';NPAccessibility.speak('Sua vez. Repita.');return}const v=S.seq[i];const el=S.mode==='colors'?document.querySelector('.seq-btn[data-c="'+v+'"]'):document.querySelector('#np [data-n="'+v+'"]');flash(el);i++},700)}
function flash(el){if(!el)return;el.classList.add('active');NPAccessibility.beep(S.mode==='colors'?({red:400,green:500,yellow:600,blue:700}[el.dataset.c]):400+(+el.dataset.n)*50,200);setTimeout(()=>el.classList.remove('active'),400)}
function onInput(v){if(S.playing)return;const exp=S.seq[S.input.length];S.input.push(v);const el=S.mode==='colors'?document.querySelector('.seq-btn[data-c="'+v+'"]'):document.querySelector('#np [data-n="'+v+'"]');flash(el);if(v!==exp){NPAccessibility.feedback('error');document.getElementById('st').textContent='Ops! Tente novamente.';setTimeout(()=>{S.level=1;S.score=0;document.getElementById('sc').textContent=0;document.getElementById('lv').textContent=1;nextRound()},1500);return}if(S.input.length===S.seq.length){S.score+=10*S.level;document.getElementById('sc').textContent=S.score;S.level++;document.getElementById('lv').textContent=S.level;NPAccessibility.feedback('success');if(S.level>6)win();else{document.getElementById('st').textContent='Muito bem!';setTimeout(nextRound,1200)}}}
function win(){const p=NPStorage.getProfile();if(p){NPStorage.addProgress(p.id,{gameId:S.mode==='colors'?'sequencia_cores':'sequencia_num',score:100,duration:0,difficulty:S.diff});p.stars=(p.stars||0)+3;NPStorage.setProfile(p)}NPAccessibility.feedback('star');alert('🎉 Parabéns!\\nPontos: '+S.score+'\\nEstrelas: 3 ⭐');reset()}
document.addEventListener('DOMContentLoaded',init);</script>
</body></html>
