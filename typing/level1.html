<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Digitação 1</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"/><link rel="stylesheet" href="../css/accessibility.css"/>
<style>
.keyboard{display:flex;flex-direction:column;gap:.5rem;max-width:800px;margin:2rem auto}
.kb-row{display:flex;gap:.5rem;justify-content:center}
.key{min-width:50px;height:50px;background:var(--np-surface);border:2px solid var(--np-border);border-radius:var(--np-radius);display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:700;transition:var(--np-transition);cursor:pointer}
.key.highlight{background:var(--np-primary);color:white;border-color:var(--np-primary);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.target-letter{font-size:8rem;text-align:center;color:var(--np-primary);font-weight:800;margin:2rem 0}
</style>
</head><body>
<div class="container py-4">
  <a href="../pages/aluno/typing.html" class="btn btn-ghost mb-3">← Voltar</a>
  <div class="card text-center">
    <h2>⌨️ Nível 1 - Encontre a letra</h2>
    <p class="text-muted">Pressione a letra destacada</p>
    <div class="flex-between mt-3" style="max-width:400px;margin:0 auto">
      <div class="badge badge-primary">Acertos: <span id="hits">0</span></div>
      <div class="badge badge-warning">Erros: <span id="miss">0</span></div>
    </div>
    <div class="target-letter" id="target">A</div>
    <div class="keyboard" id="kb"></div>
  </div>
</div>
<script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/accessibility.js"></script><script src="../js/app.js"></script>
<script>
var ROWS=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Z','X','C','V','B','N','M']];
var current='A',hits=0,miss=0;
function buildKeyboard(){
  var html='';
  ROWS.forEach(function(r){
    html+='<div class="kb-row">';
    r.forEach(function(k){html+='<div class="key '+(k===current?'highlight':'')+'" data-k="'+k+'">'+k+'</div>'});
    html+='</div>';
  });
  document.getElementById('kb').innerHTML=html;
  document.querySelectorAll('.key').forEach(function(k){k.addEventListener('click',function(){handleKey(k.dataset.k)})});
}
function newLetter(){
  var all=[];ROWS.forEach(function(r){r.forEach(function(k){all.push(k)})});
  var n;do{n=all[Math.floor(Math.random()*all.length)]}while(n===current);
  current=n;
  document.getElementById('target').textContent=current;
  buildKeyboard();
}
function handleKey(k){
  if(k===current){hits++;document.getElementById('hits').textContent=hits;NPAccess.feedback('success');if(hits>=10)win();else newLetter()}
  else{miss++;document.getElementById('miss').textContent=miss;NPAccess.feedback('error')}
}
function win(){
  var u=NPAuth.getCurrent();
  if(u){NPStorage.addProgress(u.id,{gameId:'typing_1',score:100,duration:0});var st=NPStorage.getStudent(u.id);if(st){st.stars=(st.stars||0)+2;st.xp=(st.xp||0)+30;NPStorage.updateStudent(u.id,st)}}
  NPAccess.feedback('star');
  alert('🎉 Nível 1 completo!\nAcertos: '+hits+'\nEstrelas: 2 ⭐');
  location.href='../pages/aluno/typing.html';
}
document.addEventListener('keydown',function(e){var k=e.key.toUpperCase();if(/^[A-Z]$/.test(k))handleKey(k)});
buildKeyboard();
</script></body></html>
